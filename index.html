<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Street Lifting">
<meta name="sl-build" content="20261022222432">
<meta name="description" content="Suivi de street lifting : PR, total, RIS, prog du coach, poids de corps et compétitions.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://sheets.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Street Lifting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Direction v5 (références : Whoop, Hevy, TrainingPeaks, Garmin) : fond presque noir, cartes sombres,
   un chiffre héros par écran, la couleur réservée aux 4 mouvements. Action principale en blanc craie.
   Palette des disques validée daltonisme sur fond sombre : MU or, tractions bleu, dips sarcelle, squat rouge.
   Échelle : espacements 4/8/12/16/24, rayons 12/16/22, texte 11/12/13/15/17 + titres Big Shoulders. */
:root{
  color-scheme:dark;
  --floor:#0A0B0D; --deck:#16181C; --deck2:#1F2227; --deck3:#2A2E34; --seam:#1C1F24;
  --chalk:#FFFFFF; --dust:#8A9099; --faint:#7D838C; --steel:#8E9198; --steel-hi:#B4BAC2; --brand:#1F5FD0;
  --mu:#E3B341; --pull:#4C8DF6; --dip:#2BB673; --squat:#F0524A; --bench:#A78BFA; --deadlift:#EC6FB0;
  --go:#FFFFFF; --comp:#1F5FD0; --ok:#2BB673; --warn:#E3B341; --bad:#FF6F61;
  --f-show:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-text:"Barlow",-apple-system,"Segoe UI",sans-serif;
  --r-lg:24px; --r:16px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--floor);color:var(--chalk)}
body{font:400 15px/1.45 var(--f-text);padding-block:8px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overscroll-behavior-y:none}
main{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:500 16px var(--f-text);color:var(--chalk);background:var(--deck2);border:1px solid var(--seam);border-radius:var(--r-sm);padding:11px 12px;width:100%;min-height:44px}
input[type=file]{min-height:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:20px}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6}
input::placeholder{color:#848A93}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
p{margin:0}
h1,h2,h3{margin:0;font-weight:inherit}
.show{font-family:var(--f-show);font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums;line-height:.92}
.t-xl{font-size:72px}.t-l{font-size:44px}.t-m{font-size:30px}.t-s{font-size:22px}
.unit{font-family:var(--f-text);font-size:15px;font-weight:500;color:var(--dust);margin-left:4px;letter-spacing:0}
.muted{color:var(--dust)}.small{font-size:13px}.tiny{font-size:12px}
.h2{font-family:var(--f-text);font-weight:700;font-size:18px;margin:26px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.h2 .muted{font:500 14px var(--f-text)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2>*{min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid3>*{min-width:0}
.panel{background:var(--deck);border-radius:var(--r-lg);padding:16px}
.panel+.panel{margin-top:10px}
.seam{border-top:1px solid var(--seam)}
.disc{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--c) 55%,#000);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-text);padding:4px 9px;border-radius:99px;background:var(--deck2);color:var(--dust);white-space:nowrap}
.pill.go{background:var(--chalk);color:var(--floor)}.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:none;box-shadow:inset 0 0 0 1px var(--deck3);color:var(--steel-hi)}.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:14px 18px;border-radius:28px;background:var(--chalk);color:var(--floor);font:700 16px var(--f-text);transition:transform .12s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--deck2);color:var(--chalk)}
.btn.line{background:none;border:1px solid var(--seam);color:var(--chalk)}
.btn.sm{width:auto;min-width:44px;padding:9px 14px;font-size:14px;border-radius:var(--r-sm)}
.btn:disabled{opacity:.45}
.link{color:var(--chalk);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--seam);font-weight:600}
button.link{display:inline-flex;align-items:center;min-height:44px;margin-block:-10px}
a.btn{text-decoration:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 3px;margin:-4px -3px}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;min-height:36px;min-width:44px;justify-content:center;flex:none;padding:8px 13px;border-radius:99px;background:var(--deck2);color:var(--dust);font:600 14px var(--f-text);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{background:#fff;color:var(--floor)}
.chip::after{content:"";position:absolute;inset:-4px -3px}
.bar{height:6px;border-radius:9px;background:var(--deck2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--c,var(--chalk));transition:width .7s cubic-bezier(.2,.8,.2,1)}
label{display:block;font:500 13px var(--f-text);color:var(--dust);margin:12px 0 6px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--seam);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--dust);flex:none}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td{padding:10px 0;border-top:1px solid var(--seam);vertical-align:top}
tr:first-child td{border-top:0}
td:last-child{text-align:right}

/* ---------- En-tête et barre chargée (signature) ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 4px}
.date{font-family:var(--f-show);font-weight:800;font-size:28px;line-height:1}
.date small{display:block;font:500 13px var(--f-text);color:var(--dust);margin-top:4px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--deck2);display:grid;place-items:center;font:800 18px var(--f-show);position:relative}
.avatar .dot{position:absolute;right:1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--floor);display:none}
.avatar .dot.busy{display:block;background:var(--chalk);animation:pulse 1s ease-in-out infinite}.avatar .dot.off{display:block}
.avatar .dot.off{background:var(--bad)}  /* à jour : pas de pastille ; en cours : blanche qui pulse ; pas synchronisé : rouge */
@keyframes pulse{50%{opacity:.35}}
.rack{margin:18px -16px 0;padding:0 0 0 0;overflow:hidden}
.rack svg{display:block;width:100%;height:auto}
.plate{transform-box:fill-box;transform-origin:center}
.loaded .plate{animation:slide .7s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes slide{from{transform:translateX(160px);opacity:0}to{transform:none;opacity:1}}
.totalrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:6px}
.ris{text-align:right}
.liftrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--seam)}
.liftrow button{text-align:left;min-width:0}
.ris b{display:block}

/* ---------- Carte séance du jour ---------- */
.today{position:relative;background:var(--deck);border-radius:var(--r-lg);padding:18px 16px 16px;overflow:hidden}
.today::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--c1,var(--seam)),var(--c2,var(--seam)))}
.lifts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.duo>*{background:var(--deck);border-radius:var(--r-lg);padding:14px;min-width:0;text-align:left}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center;margin-top:8px}
.stepper input{text-align:center;font:800 26px var(--f-show);padding:6px 4px}
.stepper button{height:44px;border-radius:var(--r-sm);background:var(--deck2);font:600 22px var(--f-text)}
.stepper.big{grid-template-columns:56px 1fr 56px;gap:8px;margin-top:12px}.stepper.big button,.stepper.big input{height:56px}.stepper.big input{font-size:32px}
.insight{display:flex;gap:12px;align-items:flex-start;padding:14px 0;margin-top:14px;border-top:1px solid var(--seam);border-bottom:1px solid var(--seam)}
.insight svg{flex:none;margin-top:2px}

/* ---------- Séance : grille du bloc ---------- */
.grid-bloc{display:grid;gap:6px;margin-top:10px}
.grid-bloc .h{font:600 12px var(--f-text);color:var(--dust);text-align:center;align-self:end}
.grid-bloc .wk{font:800 17px var(--f-show);color:var(--dust);align-self:center}
.cell{height:46px;border-radius:var(--r-sm);background:var(--deck2);color:var(--dust);font:600 12px/1.15 var(--f-text);display:grid;place-items:center;text-align:center}
.cell.done{background:var(--deck);color:var(--faint)}
.cell.next{box-shadow:inset 0 0 0 2px var(--chalk);color:var(--chalk)}
.cell[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--chalk);color:var(--chalk)}
.exo{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--seam);align-items:center;width:100%;text-align:left}
.exo:first-child{border-top:0}
.exo .bar-v{width:10px;height:10px;border-radius:50%;background:var(--c,var(--deck3));flex:none}
.exo .grow{flex:1;min-width:0}
.done-sets{font-size:13px;color:var(--steel-hi);margin-top:3px}

/* ---------- Pages superposées ---------- */
.page,.live{position:fixed;inset:0;background:var(--floor);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px));
  animation:pageIn .28s cubic-bezier(.2,.8,.2,1)}
.page>.wrap,.live>.wrap{max-width:560px;margin:0 auto}
@keyframes pageIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.pagebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 12px;position:sticky;top:calc(-1 * env(safe-area-inset-top,0px) - 8px);background:var(--floor);z-index:2}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--deck2);display:grid;place-items:center;flex:none}
.live{z-index:40}
.live-progress{display:flex;gap:3px;margin:4px 0 16px}
.live-progress i{flex:1;height:4px;border-radius:3px;background:var(--deck2)}
.live-progress i.on{background:var(--c,var(--chalk))}
.live-progress i.cur{background:var(--chalk)}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:6px}
.sets th{font:500 12px var(--f-text);color:var(--dust);text-align:left;padding:0 4px}
.sets td{border:0;padding:0 4px;text-align:left}
.sets td:first-child{font:800 22px var(--f-show);color:var(--dust);width:34px}
.sets input{text-align:center;font:800 24px var(--f-show);padding:8px 4px}
.sets tr.done input{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--deck2))}
.check{width:48px;height:48px;border-radius:50%;border:2px solid var(--seam);display:grid;place-items:center;color:transparent}
tr.done .check{background:var(--ok);border-color:var(--ok);color:#10261a}
.rpe{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.rpe button{flex:none;min-width:48px;height:44px;border-radius:12px;background:var(--deck);font:700 19px var(--f-show);color:var(--steel-hi)}
.rpe button[aria-pressed="true"]{background:var(--chalk);color:var(--floor)}
.coachnote{background:var(--deck);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-top:10px}
.prev{font-size:13px;color:var(--dust);margin-top:6px}

/* ---------- Feuilles (minuteur, réglages, bilan) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.6);z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--deck);border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));animation:up .3s cubic-bezier(.2,.9,.2,1)}
.sheet>.wrap{max-width:560px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--seam);margin:0 auto 12px}
@keyframes up{from{transform:translateY(100%)}}
.timer{display:grid;place-items:center;position:relative;margin:6px auto 4px;width:220px;height:220px}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer .show{font-size:68px}
.timer.over .show{color:var(--chalk)}
.score{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.score button{height:38px;border-radius:8px;background:var(--deck2);font:800 17px var(--f-show);color:var(--dust)}
.score button[aria-pressed="true"]{background:var(--chalk);color:var(--floor)}

/* ---------- Échelle d'objectif ---------- */
.scale{display:flex;height:30px;border-radius:9px;overflow:hidden;position:relative;margin-top:14px}
.scale span{display:grid;place-items:center;font:600 11px var(--f-text);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.scale .mk{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;border-radius:2px;background:var(--chalk);box-shadow:0 0 0 2px var(--deck)}
.scale-lbl{position:relative;height:18px;font:500 12px var(--f-text);color:var(--dust);font-variant-numeric:tabular-nums;margin-top:4px}
.scale-lbl b{position:absolute;transform:translateX(-50%);font-weight:500;white-space:nowrap}
.verdict{display:flex;gap:12px;margin-top:14px}
.verdict .ic{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none;background:var(--vc)}

/* ---------- Calendrier ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font:600 12px var(--f-text);color:var(--dust);padding:4px 0}
.cal .d{position:relative;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font:600 14px var(--f-text);font-variant-numeric:tabular-nums}
.cal .d.out{color:var(--faint)}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--chalk)}
.cal .d.comp{background:var(--comp);color:#fff}
.cal .d.comp.tbc{background:color-mix(in srgb,var(--comp) 35%,var(--deck2));color:var(--chalk)}
.cal .d i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--chalk)}
.cal .d i.todo{background:none;box-shadow:inset 0 0 0 1.5px var(--dust)}
.check-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--seam);width:100%;text-align:left}
.check-row:first-child{border-top:0}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--seam);display:grid;place-items:center;flex:none;color:transparent}
.check-row[aria-checked="true"] .box{background:var(--chalk);border-color:var(--chalk);color:var(--floor)}
.check-row[aria-checked="true"] span{color:var(--dust);text-decoration:line-through}
.att{display:grid;grid-template-columns:90px repeat(3,1fr);gap:6px;align-items:center;margin-top:8px}
.att input{text-align:center;font:800 20px var(--f-show);padding:8px 2px}
.att .res{display:flex;justify-content:center;gap:4px;margin-top:4px}
.att .res button{width:28px;height:24px;border-radius:6px;background:var(--deck2);font:700 12px var(--f-text);color:var(--dust)}
.att .res button[aria-pressed="true"].y{background:var(--ok);color:#10261a}
.att .res button[aria-pressed="true"].n{background:var(--bad);color:#2a0d0a}

/* ---------- Barre d'onglets ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--floor) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--seam);
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(4px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;min-height:48px;font:600 11px var(--f-text);color:var(--dust);transition:color .2s}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--chalk)}
.tabs button[aria-current="page"] svg{color:var(--chalk)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,calc(-100% - 160px));z-index:60;background:var(--chalk);color:var(--floor);
  padding:11px 16px;border-radius:14px;font:600 14px var(--f-text);width:max-content;max-width:calc(100% - 32px);transition:transform .3s cubic-bezier(.2,.9,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{transform:translate(-50%,0)}
body:has(.live) .toast{top:calc(env(safe-area-inset-top,0px) + 66px)}
.toast.bad{background:var(--bad);color:#2a0d0a}
.empty{padding:28px 0;text-align:center;color:var(--dust);display:flex;flex-direction:column;align-items:center;gap:12px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--deck2);border-top-color:var(--go);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--deck) 0%,var(--deck2) 50%,var(--deck) 100%);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:var(--r-lg)}
@keyframes sk{to{background-position:-200% 0}}
.burst{animation:burst .9s cubic-bezier(.2,.9,.2,1)}
@keyframes burst{30%{transform:scale(1.08)}}
canvas{display:block;width:100%}
.src{font-size:12.5px;color:var(--dust);line-height:1.55}
.src a{color:var(--chalk)}
details>summary{cursor:pointer;list-style:none;font-weight:600}
.h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dust);margin:20px 0 8px}
details.more>summary::after{content:"";display:inline-block;width:8px;height:8px;border-right:2px solid var(--dust);border-bottom:2px solid var(--dust);transform:rotate(45deg);margin-left:10px;vertical-align:4px;transition:transform .2s}
details.more[open]>summary::after{transform:rotate(225deg);vertical-align:0}
details>summary::-webkit-details-marker{display:none}

/* ---------- v5 : composants ---------- */
.card{background:var(--deck);border-radius:var(--r-lg);padding:16px}
.card+.card,.card+.tiles,.tiles+.card{margin-top:12px}
.eyebrow{font:700 12px var(--f-text);letter-spacing:.08em;text-transform:uppercase;color:var(--dust)}
.rise{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.view>.rise:nth-child(2){animation-delay:.05s}.view>.rise:nth-child(3){animation-delay:.1s}.view>.rise:nth-child(4){animation-delay:.15s}.view>.rise:nth-child(5){animation-delay:.2s}
.exline{display:flex;align-items:center;gap:10px;font-size:15px}
.exline b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

async function readImport(file){
  if (!file) return;
  if (/\.zip$/i.test(file.name) || /zip/.test(file.type)) {
    $("#impres").innerHTML = `<p class="small muted" style="margin-top:12px">Lecture de l'archive…</p>`;
    try {
      if (!window.JSZip) await new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
      const z = await JSZip.loadAsync(file), names = Object.keys(z.files).filter(n => /\.csv$/i.test(n));
      const pick = names.find(n => /measure|mesure|weight|poids/i.test(n)) || names[0];
      if (!pick) { $("#impres").innerHTML = `<p class="small" style="margin-top:12px;color:var(--bad)">Aucun fichier CSV dans l'archive.</p>`; return; }
      return parseImport(await z.file(pick).async("string"));
    } catch(e){ $("#impres").innerHTML = `<p class="small" style="margin-top:12px;color:var(--bad)">Archive illisible : décompresse-la et choisis le fichier « measurements ».</p>`; return; }
  }
  const rd = new FileReader(); rd.onload = () => parseImport(String(rd.result)); rd.readAsText(file);
}
function parseImport(raw){
  {
    const txt = String(raw).replace(/^﻿/, ""), lines = txt.split(/\r?\n/).filter(l => l.trim());
    const sep = [",", ";", "\t"].sort((a, b) => lines[0].split(b).length - lines[0].split(a).length)[0], split = l => l.split(sep).map(x => x.replace(/^"|"$/g, "").trim());
    const head = split(lines[0]).map(h => h.toLowerCase()); let di = head.findIndex(h => /date|jour/.test(h)), wi = head.findIndex(h => /weight|poids|body ?mass/.test(h));
    const lb = head.some(h => /\blbs?\b|pound/.test(h)), rows = [];
    for (const l of lines.slice(1)) { const c = split(l); if (di < 0) di = 0; if (wi < 0) wi = c.findIndex((x, i) => i !== di && num(x) > 20 && num(x) < 600);
      let w = num(c[wi]); if (!w) continue; let iso = toIso(c[di] || "");
      if (!iso) { const m = (c[di] || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) iso = m[3] + "-" + m[1].padStart(2, "0") + "-" + m[2].padStart(2, "0"); }
      if (!iso) { const t = new Date(c[di]); if (!isNaN(t)) iso = isoOf(t); } if (!iso) continue; if (lb) w *= 0.45359237; if (w > 25 && w < 250) rows.push([iso, Math.round(w * 10) / 10]); }
    const have = new Set(D.poids.map(p => p.date)), fresh = rows.filter(r => !have.has(r[0])); importRows = fresh; const ds = rows.map(r => r[0]).sort();
    $("#impres").innerHTML = rows.length ? `<p class="small" style="margin-top:12px">${rows.length} pesées trouvées${lb ? " (converties de lb en kg)" : ""}, du ${dfr(ds[0])} au ${dfr(ds.at(-1))}. ${fresh.length} nouvelles.</p>${fresh.length ? `<button class="btn" style="margin-top:12px" id="impb" data-act="doImport">Importer ${fresh.length} pesées</button>` : ""}`
      : `<p class="small" style="margin-top:12px;color:var(--bad)">Aucune pesée reconnue. Le fichier doit contenir une colonne date et une colonne poids.</p>`;
  }
}

    <p class="src" style="margin-top:8px"><b style="color:var(--chalk)">IPF GL</b> : formule officielle de l'IPF, coefficients 2020 toujours en vigueur (<a href="https://www.powerlifting.sport/rules/codes/info/ipf-formula" target="_blank" rel="noopener">IPF GL Formula</a>). Classic ou equipped selon ton réglage.</p>
    <p class="src" style="margin-top:8px"><b style="color:var(--chalk)">Catégories</b> : street lifting, <a href="https://www.officialstreetlifting.com/s/OSL_OFFICIAL_RULEBOOK_2026_v16.pdf" target="_blank" rel="noopener">règlement Official Streetlifting v1.6</a> (octobre 2026) ; powerlifting et âges, <a href="https://www.powerlifting.sport/rules/codes/info/technical-rules" target="_blank" rel="noopener">règlement technique IPF</a> en vigueur depuis le 1er mars 2026. Un poids égal à la limite reste dans la catégorie ; les âges se comptent en année civile.</p>
    <p class="src" style="margin-top:8px"><b style="color:var(--chalk)">Records</b> : <a href="https://rankings.officialstreetlifting.com/" target="_blank" rel="noopener">Official Streetlifting</a>, tableaux de records par catégorie, relevés le 20/10/2026. Record de Belgique : meilleure perf belge de ces tableaux.</p>
    <p class="src" style="margin-top:8px"><b style="color:var(--chalk)">1RM estimé</b> : table RPE de Reactive Training Systems (Tuchscherer), la même que la colonne E1RM de ta prog : % du 1RM selon les reps et les reps en réserve (RIR = 10 − RPE, <a href="https://doi.org/10.1519/JSC.0000000000001049" target="_blank" rel="noopener">Zourdos et al., 2016</a>). Calcul sur la charge réelle (poids de corps + lest) pour muscle-up, tractions et dips. RPE pris en compte de 5 à 10 (plus on est loin de l'échec, moins l'effort se juge bien : <a href="https://www.strongerbyscience.com/reps-in-reserve" target="_blank" rel="noopener">synthèse Stronger by Science</a>). Il part de ta série la plus lourde de 2 reps ou plus (à charge égale, la meilleure estimation ; un 1 rep à fond, c'est déjà ton PR) : une série légère à beaucoup de reps ne gonfle pas l'estimation. Séries de 10 reps au plus (<a href="https://researchconnect.suny.edu/en/publications/accuracy-of-prediction-equations-for-determining-one-repetition-m/" target="_blank" rel="noopener">Mayhew et al., 2008</a>).</p>
    <p class="src" style="margin-top:8px"><b style="color:var(--chalk)">Aliments</b> : <a href="https://ciqual.anses.fr/" target="_blank" rel="noopener">table Ciqual 2025 de l'Anses</a> (Licence Ouverte), portions courantes de l'étude INCA3 ; produits de marque : <a href="https://world.openfoodfacts.org/" target="_blank" rel="noopener">Open Food Facts</a> (base collaborative, ODbL).</p>
    <p class="src" style="margin-top:8px"><b style="color:var(--chalk)">Besoins</b> : formule de Mifflin-St Jeor × activité. Rythmes : perte 0,5 à 1 % du poids par semaine (<a href="https://openrepository.aut.ac.nz/items/723f44d2-7c20-4214-ba62-987339099039/full" target="_blank" rel="noopener">Helms et al., 2014</a>), prise 0,25 à 0,5 % (<a href="https://www.mdpi.com/2075-4663/7/7/154" target="_blank" rel="noopener">Iraki et al., 2019</a>).</p>
    <p class="muted tiny" style="margin-top:14px">Version de l'app : ${APP_VER}</p>
    <button class="btn" style="margin-top:18px" data-act="closeSheet">Fermer</button>`;
}

/* Chart.js est chargé en différé (premier affichage plus rapide) : les graphiques demandés avant sont dessinés dès qu'il est prêt. */
const chartQ = new Map(); let chartReady = false;
document.addEventListener("DOMContentLoaded", () => { chartReady = true; chartQ.forEach(f => f()); chartQ.clear(); });
const fmtK = v => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("fr-FR") : fmt(v, 1);
function getCss(v){ const m = String(v).match(/var\((--[^)]+)\)/); return m ? getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() : v; }
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function opts(o = {}){
  const dust = getCss("var(--dust)"), seam = getCss("var(--seam)");
  return {animation:reduceMotion() ? false : {duration:500}, maintainAspectRatio:true, aspectRatio:1.6, interaction:{mode:"index", intersect:false},
    plugins:{legend:{display:!!o.legend, labels:{color:dust, boxWidth:10, boxHeight:10, usePointStyle:true, font:{family:"Barlow"}}},
      tooltip:{backgroundColor:getCss("var(--deck3)"), borderColor:"rgba(255,255,255,.08)", borderWidth:1, titleColor:"#FFFFFF", bodyColor:"#D9DCE1", footerColor:"#FFFFFF", padding:10, cornerRadius:10, displayColors:false,
        
        callbacks:{label:c => c.dataset.label + " : " + fmt(c.parsed.y, 1) + (o.unit || ""), afterBody:o.tooltip ? items => o.tooltip(items[0].dataIndex) : undefined}}},
    scales:{x:{ticks:{color:dust, maxTicksLimit:5, maxRotation:0, font:{family:"Barlow", size:11}}, grid:{display:false}, border:{color:seam}},
            y:{ticks:{color:dust, maxTicksLimit:5, font:{family:"Barlow", size:11}, callback:v => fmtK(v)}, grid:{color:seam, drawTicks:false}, border:{display:false}}}};
}
function lineChart(id, labels, sets, o = {}){
  const el = document.getElementById(id); if (!el) return;
  if (typeof Chart === "undefined") { if (!chartReady) chartQ.set(id, () => lineChart(id, labels, sets, o)); return; }
  if (charts[id]) charts[id].destroy();
  const ctx = el.getContext("2d");
  charts[id] = new Chart(el, {type:"line", data:{labels, datasets:sets.map(s => {
    let bg = s.color; if (s.area) { const g = ctx.createLinearGradient(0, 0, 0, 240); g.addColorStop(0, s.color + "55"); g.addColorStop(1, s.color + "00"); bg = g; } else if (s.fill) bg = s.color + "30";
    const n = s.data.length;
    return {label:s.label, data:s.data, borderColor:s.faint ? s.color + "99" : s.color, backgroundColor:bg, fill:s.area ? "origin" : (s.fill || false), borderDash:s.dash ? [5, 5] : [], borderWidth:s.width || 2,
      pointRadius:s.pts === false || s.dash ? 0 : (ctx2 => ctx2.dataIndex === n - 1 ? 5 : (n > 30 ? 0 : 2.5)), pointBackgroundColor:s.color, pointBorderColor:getCss("var(--deck)"), pointBorderWidth:2, tension:.3};
  })}, options:opts(o)});
}
function barChart(id, labels, sets, unit){
  const el = document.getElementById(id); if (!el) return;
  if (typeof Chart === "undefined") { if (!chartReady) chartQ.set(id, () => barChart(id, labels, sets, unit)); return; }
  if (charts[id]) charts[id].destroy();
  const o = opts({legend:true, unit}); o.scales.x.stacked = true; o.scales.y.stacked = true;
  /* Infobulle : seulement les mouvements faits cette semaine-là, puis le total. */
  o.plugins.tooltip.filter = c => c.parsed.y > 0;
  o.plugins.tooltip.callbacks.label = c => c.dataset.label + " : " + fmtK(c.parsed.y) + (unit || "");
  o.plugins.tooltip.callbacks.footer = items => { const t = items.reduce((a, c) => a + (c.parsed.y || 0), 0); return items.length > 1 ? "Total : " + fmtK(t) + (unit || "") : ""; };
  charts[id] = new Chart(el, {type:"bar", data:{labels, datasets:sets.map(s => ({label:s.label, data:s.data, backgroundColor:s.color, borderColor:getCss("var(--deck)"), borderWidth:{top:2}, borderRadius:4, borderSkipped:"bottom", maxBarThickness:28}))}, options:o});
}

/* =====================================================================
   ALIMENTATION : table Ciqual 2025 (Anses) + Open Food Facts pour les marques
   Carnet : onglet REPAS (une ligne par aliment pesé) et ALIMENTS (aliments de marque ou créés).
   ===================================================================== */
let corpsTab = "nutri", nutDate = null, FOODS = null, foodsLoading = null, nutQ = "", nutPick = null, offRes = null, offBusy = false, nutCreate = false;
const NUT_ACT = [[1.375, "Peu actif (1 à 3 séances)"], [1.55, "Actif (4 à 5 séances)"], [1.725, "Très actif (6+ séances ou travail physique)"]];
const NUT_OBJ = [["suivi", "Juste suivre ce que je mange"], ["maintien", "Garder mon poids"], ["perte", "Perdre du poids"], ["prise", "Prendre du poids"], ["compet", "Faire le poids pour une compétition"]];
const deacc = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/œ/g, "oe").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
function loadFoods(){
  if (FOODS) return Promise.resolve(FOODS);
  if (!foodsLoading) foodsLoading = fetch("aliments.json").then(r => r.json()).then(j => {
    FOODS = j.a.map(a => ({src:"ciqual", code:String(a[0]), nom:a[1], k:a[2], p:a[3], g:a[4], l:a[5], f:a[6], su:a[7], se:a[8], por:a[9], est:a[10], n:deacc(a[1])}));
    return FOODS; }).catch(e => { foodsLoading = null; throw e; });
  return foodsLoading;
}
/* Aliments de base d'un sportif : remontent en tête des suggestions (ordre = priorité). */
const STAPLES = ["pomme de terre","poulet","pates seches","riz blanc","oeuf","pain","banane","pomme","flocons d avoine","lait","yaourt","fromage blanc","skyr","thon","saumon","boeuf","steak hache","jambon","dinde","haricot","lentille","pois chiche","brocoli","carotte","tomate","courgette","epinard","haricot vert","patate douce","avocat","amande","noix","beurre de cacahuete","huile d olive","beurre","miel","chocolat","fraise","orange","kiwi","mangue","raisin","poire","semoule","quinoa","cereales","muesli","emmental","mozzarella","creme fraiche","sucre","confiture","compote","petits pois","mais","concombre","salade","oignon","champignon","porc","cabillaud","crevette","tofu","whey"].map((s, i) => [s, 40 - i * 0.5]);
const persoFoods = () => (D.aliments || []).map(a => ({...a, n:deacc(a.nom + " " + (a.marque || ""))}));
/* Recherche : chaque mot tapé doit commencer un mot du nom ; le 1er mot du nom, les noms courts et les aliments courants (portion INCA3 connue) passent devant. */
/* mots courants absents des noms de la table Ciqual */
const FOOD_SYN = [[/\bviandes? hachees?\b/g, "boeuf steak hache"], [/\bhache(e|es|s)\b/g, "hache"], [/\b(blanc|filet|escalope)s? de poulet\b/g, "poulet filet"],
  [/\b(blanc|filet|escalope)s? de dinde\b/g, "dinde filet"], [/\bspaghettis?\b/g, "pates"], [/\bpatates?\b/g, "pomme de terre"]];
const stem = x => x.length > 3 ? x.replace(/(s|x)$/, "") : x;
function searchFoods(q, max){
  let qq = deacc(q); for (const [re, to] of FOOD_SYN) qq = qq.replace(re, to);
  const t = qq.split(" ").filter(w => w && !/^(de|d|du|des|la|le|les|l|a|au|aux|en|et)$/.test(w)); if (!t.length) return [];
  const pool = persoFoods().concat(FOODS || []), out = [];
  for (const f of pool) {
    const w = f.n.split(" "); let ok = true, sc = 0;
    for (const x of t) { const sx = stem(x), i = w.findIndex(y => y.startsWith(x) || y.startsWith(sx)); if (i < 0) { ok = false; break; } sc += i === 0 ? 30 : i < 3 ? 12 : 4; if (w[i] === x || stem(w[i]) === sx) sc += 6; }
    if (!ok) continue;
    sc -= f.n.length / 6; if (f.por) sc += 8;
    for (const [st, b] of STAPLES) if (f.n.startsWith(st)) { sc += b * (t.join(" ").length <= 3 ? 4 : .4); break; } if (f.src !== "ciqual") sc += 25; if (/prelev|martinique|guadeloupe|reunion|guyane|mayotte/.test(f.n)) sc -= 20;
    out.push([sc, f]);
  }
  return out.sort((a, b) => b[0] - a[0]).slice(0, max || 8).map(x => x[1]);
}
/* « 250 g de pâtes sèches », « pâtes 250g », « 1 cordon bleu », « 2 oeufs » */
function parseFoodLine(s){
  const t = String(s || "").trim(); let m;
  if ((m = t.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|gr|grammes?|ml|cl|l)\b\.?\s*(?:d['’]\s*|de\s+|du\s+|des\s+)?(.+)$/i))) return {q:qtyG(m[1], m[2]), txt:m[3]};
  if ((m = t.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(kg|g|gr|grammes?|ml|cl|l)\.?$/i))) return {q:qtyG(m[2], m[3]), txt:m[1]};
  if ((m = t.match(/^(\d+(?:[.,]\d+)?)\s+(?:x\s*)?(.+)$/i))) return {n:num(m[1]), txt:m[2]};
  return {txt:t};
}
const qtyG = (v, u) => { const x = num(v), k = String(u).toLowerCase(); return k === "kg" || k === "l" ? x * 1000 : k === "cl" ? x * 10 : x; };
const macrosOf = (f, q) => ({k:f.k * q / 100, p:(f.p || 0) * q / 100, g:(f.g || 0) * q / 100, l:(f.l || 0) * q / 100});

/* ---------- Besoins : Mifflin-St Jeor × activité, puis objectif ---------- */
function ageNow(){ const n = toIso(D.profil.naissance); if (n) return Math.floor(days(n, D.today) / 365.25); return num(D.profil.age) || null; }
function nutTargets(day){
  const P = D.poids, w = P.length ? (avg7(P).at(-1) || P.at(-1).poids) : null, h = num(D.profil.taille_cm), a = ageNow();
  if (!w) return {missing:["une pesée"]};
  if (!h || !a) return {missing:[!h && "ta taille", !a && "ton âge"].filter(Boolean)};
  const bmr = h && a ? 10 * w + 6.25 * h - 5 * a + (sexe() === "F" ? -161 : 5) : null, act = num(D.profil.nut_activite) || 1.55, tdee = bmr * act;
  const obj = D.profil.nut_objectif || "suivi"; let rate = 0, note = "", warn = "";
  if (obj === "perte") rate = -(num(D.profil.nut_rythme) || 0.5);
  if (obj === "prise") rate = num(D.profil.nut_rythme) || 0.25;
  if (obj === "compet") { const lim = num(D.profil.nut_cible) || catLimit(), dt = toIso(D.profil.nut_date) || (nextComp() || {}).date;
    if (lim && dt) { const wk = Math.max(1, days(D.today, dt) / 7), need = w - lim + 0.3; /* 300 g de marge sous la limite */
      if (need <= 0) note = "Tu es déjà sous la limite de " + fmt(lim, 1) + " kg avec la marge : garde ton poids.";
      else { rate = -need / wk / w * 100; note = `Il faut perdre ${fmt(need, 1)} kg (avec 300 g de marge) en ${fmt(wk, 1)} semaines.`;
        if (rate < -1) { warn = `C'est plus de 1 % de ton poids par semaine : trop rapide pour garder ta force. L'app plafonne à 1 % ; parle-en à ton coach (catégorie, date).`; rate = -1; } } }
    else note = "Indique ta limite de poids et la date de la pesée."; }
  const delta = obj === "suivi" || obj === "maintien" ? 0 : w * rate / 100 * 7700 / 7;
  let kcal = tdee + delta; if (bmr && kcal < bmr) { warn = warn || "Le déficit demandé passerait sous ton métabolisme de base : l'app s'arrête à ce plancher."; kcal = bmr; }
  const pk = rate < 0 ? 2.2 : 1.8, p = pk * w, l = Math.max(0.5 * w, kcal * 0.25 / 9), g = Math.max(0, (kcal - p * 4 - l * 9) / 4);
  return {w, bmr, tdee, kcal, p, g, l, pk, rate, obj, note, warn};
}

function clSync(){

    if (!clOn()) return;
    const tok = typeof auth !== "undefined" ? auth.tok : null;
    try {
      /* requête « simple » (texte brut, sans en-tête) : pas de pré-vérification CORS, acceptée par Apps Script */
      const r = tok ? await fetch(CLASSEMENT_URL, {method:"POST", body:JSON.stringify({token:tok, data:myStats()})}) : await fetch(CLASSEMENT_URL);
      const j = await r.json();
      if (j.error) throw new Error(j.error === "auth" ? "Connexion Google à renouveler pour le classement." : "Classement : " + j.error);
      /* sans jeton, le service ne sait pas qui tu es : on garde la ligne « toi » de la dernière fois */
      const prevMe = CL && CL.rows ? (CL.rows.find(x => x.me) || {}).nom : null;
      const rows = Array.isArray(j.rows) ? j.rows : [];

let VIDX = {}, VIDL = null, vidUrls = [], vidDraft = null, vidDel = null;
function vidDb(){ return new Promise((ok, ko) => { const r = indexedDB.open("sl-videos", 1);
  r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", {keyPath:"id"}); if (!db.objectStoreNames.contains("blob")) db.createObjectStore("blob"); };
  r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
/* une transaction = des requêtes lancées d'un coup (pas d'attente au milieu : Safari ferme la transaction) */
async function vidTx(stores, mode, fn){ const db = await vidDb(); return new Promise((ok, ko) => { let out; const t = db.transaction(stores, mode);
  const r = fn(t); if (r && "onsuccess" in r) r.onsuccess = () => { out = r.result; };
  t.oncomplete = () => ok(out); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error); }); }
async function vidLoad(){ try { VIDL = await vidTx(["meta"], "readonly", t => t.objectStore("meta").getAll()) || []; } catch(e){ VIDL = []; }
  VIDX = {}; VIDL.forEach(m => { const k = m.lift + "|" + m.reps; VIDX[k] = (VIDX[k] || 0) + 1; }); return VIDL; }

async function vidBlob(id){ const v = await vidTx(["blob"], "readonly", t => t.objectStore("blob").get(id)); return v && v.buf ? new Blob([v.buf], {type:v.type}) : v; }

/* Jeton expiré : la séance en cours est déjà gardée sur le téléphone, on se reconnecte et on la rouvre. */
function reauth(){
  if (!navigator.onLine) throw {code:"offline"};
  if (live) { persistLive(); store.set("sl-resume", 1); }
  toast("Reconnexion à Google…"); setTimeout(() => auth.login(), 700);
  return new Promise(() => {});
}
async function gapi(url, opt, isRead){
  const tok = auth.tok; if (!tok) return reauth();
  for (let i = 0; ; i++) {
    let r;
    try { r = await fetch(url, Object.assign({}, opt, {headers:{Authorization:"Bearer " + tok, "Content-Type":"application/json"}})); }
    catch(e){ throw {code:"offline"}; }
    if (r.status === 401) { store.del("sl-tok"); return reauth(); }
    if ((r.status === 429 || r.status >= 500) && isRead && i < 2) { await sleep(1500 * (i + 1) + Math.random() * 500); continue; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw {code: r.status === 403 ? "forbidden" : r.status === 404 ? "not_found" : r.status === 429 ? "quota" : r.status >= 500 ? "server_unavailable" : "tool_error",
      retryable: r.status === 429 || r.status >= 500, message: (j.error && j.error.message) || ("Erreur " + r.status)};
    return j;
  }
}

const dlr = {async save({filename, data}){

function parseCoachProfile(v){
  const out = {}, cell = (r, c) => String((v[r] && v[r][c]) ?? "").trim();
  const numRight = (r, c) => { for (let k = c + 1; k <= c + 3; k++) { const t = cell(r, k); if (t !== "" && num(t) !== null) return num(t); } return null; };
  const MAP = {MU:"MU", "MUSCLE UP":"MU", PU:"PULL", "PULL UP":"PULL", TRACTIONS:"PULL", DIPS:"DIP", DIP:"DIP", SQUAT:"SQUAT", BENCH:"BENCH", "BENCH PRESS":"BENCH", BP:"BENCH", DC:"BENCH", DEADLIFT:"DEADLIFT", DL:"DEADLIFT", SDT:"DEADLIFT"};
  for (let r = 0; r < v.length; r++) for (let c = 0; c < (v[r] || []).length; c++) {
    const t = norm(cell(r, c));
    if (t === "MAX ACTUELS" && out.max === undefined) { out.max = true;
      for (let rr = r + 1; rr < Math.min(v.length, r + 8); rr++) { const k = MAP[norm(cell(rr, c))]; if (k) { const n = numRight(rr, c); if (n) out["pr_" + k] = n; } } }
    if (t === "POIDS" && out.poids === undefined) out.poids = numRight(r, c) ?? undefined;
    if (t === "TAILLE" && out.taille === undefined) { const n = numRight(r, c); if (n) out.taille = n < 3 ? Math.round(n * 100) : n; }
  }
  delete out.max;
  if (out.poids) { const c = CATS.find(x => x < 0 && out.poids <= -x); out.categorie = c ?? CATS.at(-1); }
  return out;
}

}

  switchBook:() => { setCfg({appId:""}); APP_ID = ""; D = null; S = []; sheet = null; renderLayer(); onboard("carnet"); },
  logout:() => { auth.logout(); store.set("sl-cfg", {}); APP_ID = ""; D = null; S = []; sheet = null; renderLayer(); onboard("login"); }
});
CHG.coachLink = async (d, el) => {
  const id = idOf(el.value); if (el.value.trim() && !id) return toast("Ce lien de Google Sheet n'est pas reconnu", true);
  if (id) { try { await getTitles(id); } catch(e){ return toast("Prog inaccessible : " + errMsg(e), true); } }
  await CHG.prof({k:"coach_sheet_id"}, {value:id});
  S = []; loadedBlocs.clear(); allLoaded = false; weekMeta = {}; blocNames = {}; progOrder = []; liveIds = new Set(); archMeta = {}; liveCycle = {}; syncAll(false);
};
async function fetchEmail(){
  if (cfg().email) return;
  try { const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {headers:{Authorization:"Bearer " + auth.tok}}); const j = await r.json(); if (j.email) setCfg({email:j.email}); } catch(e){}
}

/* =====================================================================
   SYNCHRO ET DÉMARRAGE
   ===================================================================== */
async function syncAll(silent){
  if (syncing || !APP_ID) return; syncing = true; setDot("busy");
  try {
    /* La liste des onglets de la prog est lue en même temps que le carnet (le lien de la prog est déjà connu). */
    const cid0 = D && coachId(), pt = cid0 ? progTabs(cid0).catch(() => null) : null;
    await loadApp(); render();
    try { await loadCoach(cid0 && cid0 === coachId() ? pt : null); seanceErr = ""; } catch(e){ seanceErr = "Impossible de lire ta prog : " + errMsg(e); }
    lastSync = Date.now(); setDot(seanceErr ? "off" : "ok"); saveCache(); render();
    if (clOn()) clSync().then(() => { if (tab === "agenda" && agendaSeg === "amis" && !sheet) rAgenda(); }).catch(() => {});
    if (seanceErr && S.length) toast(seanceErr, true);
    if (!silent) toast("Données à jour");
    if (!seanceErr) ensureAllBlocs().then(() => { if (tab !== "seance" && !live) render(); }).catch(() => {});
  } catch(e){ setDot("off"); if (!D) fatal(errMsg(e)); else toast(errMsg(e), true); }
  finally { syncing = false; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && D && Date.now() - lastSync > 60000 && !live) syncAll(true); });
setInterval(() => { if (document.visibilityState === "visible" && D && Date.now() - lastSync > 10 * 60000 && !live) syncAll(true); }, 60000);
function fatal(msg){ $("#v-home").innerHTML = `<div class="empty"><p>${esc(msg)}</p><button class="btn ghost sm" data-act="boot">Réessayer</button><button class="btn ghost sm" data-act="switchBook">Changer de carnet</button></div>`; }
ACT.boot = () => boot();
ACT.relogin = () => { if (live) persistLive(); auth.login(); };
async function startApp(){
  document.body.classList.remove("ob");
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "v-" + tab);
  $("#v-home").innerHTML = `<div class="skel" style="height:190px;margin-top:18px"></div><div class="skel" style="height:150px;margin-top:14px"></div>`;
  const cached = loadCache(); if (cached) { render(); autoResume(); }
  if (!auth.tok) {
    setDot("off");
    /* Accès Google expiré : on laisse d'abord s'afficher les dernières données (2 images), puis on renouvelle l'accès. */
    if (navigator.onLine && !auth.err) { if (cached) return requestAnimationFrame(() => requestAnimationFrame(() => auth.login())); return auth.login(); }
    if (auth.err) toast("Connexion Google refusée. Réglages, Se reconnecter.", true);
    if (!cached) fatal(auth.err ? "Connexion Google refusée ou annulée." : "Pas de connexion internet. Reviens quand tu as du réseau.");
    return;
  }
  fetchEmail();
  await syncAll(true);
  if (store.get("sl-resume")) { store.del("sl-resume"); const lv = store.get(ck("sl4-live")); if (!live && lv && seanceByKey(lv.key)) startLive(lv.key); }
}
async function boot(){
  auth.fromHash();
  if (!/\.apps\.googleusercontent\.com$/.test(CLIENT_ID)) return onboard("config");
  APP_ID = cfg().appId || "";
  if (APP_ID) return startApp();
  if (!auth.tok) return onboard("login", auth.err ? "Connexion annulée (" + auth.err + "). Réessaie." : "");
  fetchEmail(); onboard("carnet");
}
boot();
/* Mises à jour : l'app s'ouvre depuis le téléphone ; si une nouvelle version arrive, elle s'installe
   tout de suite si tu n'as encore rien touché, sinon un bandeau te la propose (jamais pendant une séance). */
const T0 = Date.now(); let touched = false, updShown = false;
addEventListener("pointerdown", () => { touched = true; }, {once:true, capture:true});
function newVersion(){
  if (live || updShown || auth.leaving) return;
  let last = 0; try { last = +sessionStorage.getItem("sl-upd") || 0; } catch(e){}
  if (!touched && Date.now() - T0 < 4000 && !sheet && !page && Date.now() - last > 60000) { try { sessionStorage.setItem("sl-upd", Date.now()); } catch(e){} return location.reload(); }
  updShown = true; const b = document.createElement("div"); b.className = "upd"; b.setAttribute("role", "status");
  b.innerHTML = 'Nouvelle version prête <button type="button">Mettre à jour</button>'; b.querySelector("button").onclick = () => location.reload();
  document.body.appendChild(b);
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "sl-update") newVersion(); });
}
</script>
