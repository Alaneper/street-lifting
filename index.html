<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Street Lifting">
<meta name="sl-build" content="20261030161848">
<meta name="description" content="Suivi de street lifting : PR, total, RIS, prog du coach, poids de corps et compétitions.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://sheets.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Street Lifting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Direction v5 (références : Whoop, Hevy, TrainingPeaks, Garmin) : fond presque noir, cartes sombres,
   un chiffre héros par écran, la couleur réservée aux 4 mouvements. Action principale en blanc craie.
   Palette des disques validée daltonisme sur fond sombre : MU or, tractions bleu, dips sarcelle, squat rouge.
   Échelle : espacements 4/8/12/16/24, rayons 12/16/22, texte 11/12/13/15/17 + titres Big Shoulders. */
:root{
  color-scheme:dark;
  --floor:#0A0B0D; --deck:#16181C; --deck2:#1F2227; --deck3:#2A2E34; --seam:#1C1F24;
  --chalk:#FFFFFF; --dust:#8A9099; --faint:#7D838C; --steel:#8E9198; --steel-hi:#B4BAC2; --brand:#1F5FD0;
  --mu:#E3B341; --pull:#4C8DF6; --dip:#2BB673; --squat:#F0524A; --bench:#A78BFA; --deadlift:#EC6FB0; --cardio:#4FD1C5;
  --go:#FFFFFF; --comp:#1F5FD0; --ok:#2BB673; --warn:#E3B341; --bad:#FF6F61;
  --f-show:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-text:"Barlow",-apple-system,"Segoe UI",sans-serif;
  --r-lg:24px; --r:16px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--floor);color:var(--chalk)}
body{font:400 15px/1.45 var(--f-text);padding-block:8px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overscroll-behavior-y:none}
main{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:500 16px var(--f-text);color:var(--chalk);background:var(--deck2);border:1px solid var(--seam);border-radius:var(--r-sm);padding:11px 12px;width:100%;min-height:44px}
input[type=file]{min-height:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:20px}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6}
input::placeholder{color:#848A93}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
p{margin:0}
h1,h2,h3{margin:0;font-weight:inherit}
.show{font-family:var(--f-show);font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums;line-height:.92}
.t-xl{font-size:72px}.t-l{font-size:44px}.t-m{font-size:30px}.t-s{font-size:22px}
.unit{font-family:var(--f-text);font-size:15px;font-weight:500;color:var(--dust);margin-left:4px;letter-spacing:0}
.muted{color:var(--dust)}.small{font-size:13px}.tiny{font-size:12px}
.h2{font-family:var(--f-text);font-weight:700;font-size:18px;margin:26px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.h2 .muted{font:500 14px var(--f-text)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2>*{min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid3>*{min-width:0}
.panel{background:var(--deck);border-radius:var(--r-lg);padding:16px}
.panel+.panel{margin-top:10px}
.seam{border-top:1px solid var(--seam)}
.disc{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--c) 55%,#000);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-text);padding:4px 9px;border-radius:99px;background:var(--deck2);color:var(--dust);white-space:nowrap}
.pill.go{background:var(--chalk);color:var(--floor)}.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:none;box-shadow:inset 0 0 0 1px var(--deck3);color:var(--steel-hi)}.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:14px 18px;border-radius:28px;background:var(--chalk);color:var(--floor);font:700 16px var(--f-text);transition:transform .12s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--deck2);color:var(--chalk)}
.btn.line{background:none;border:1px solid var(--seam);color:var(--chalk)}
.btn.sm{width:auto;min-width:44px;padding:9px 14px;font-size:14px;border-radius:var(--r-sm)}
.btn:disabled{opacity:.45}
.link{color:var(--chalk);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--seam);font-weight:600}
button.link{display:inline-flex;align-items:center;min-height:44px;margin-block:-10px}
a.btn{text-decoration:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 3px;margin:-4px -3px}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;min-height:36px;min-width:44px;justify-content:center;flex:none;padding:8px 13px;border-radius:99px;background:var(--deck2);color:var(--dust);font:600 14px var(--f-text);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{background:#fff;color:var(--floor)}
.chip::after{content:"";position:absolute;inset:-4px -3px}
.bar{height:6px;border-radius:9px;background:var(--deck2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--c,var(--chalk));transition:width .7s cubic-bezier(.2,.8,.2,1)}
label{display:block;font:500 13px var(--f-text);color:var(--dust);margin:12px 0 6px}
.list{display:flex;flex-direction:column}
.sfield{position:relative;margin-top:10px}.sfield input{padding-right:56px}
.scanbtn{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:var(--r-sm);background:var(--deck3);display:grid;place-items:center}
.scanfull{position:fixed;inset:0;z-index:70;background:#050607;color:#fff;display:flex;flex-direction:column;overflow:hidden}
.scanfull video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#050607}
.scantop{position:relative;display:flex;justify-content:space-between;align-items:center;padding:max(env(safe-area-inset-top,0px),18px) 16px 0}
.scantop .iconbtn{background:rgba(255,255,255,.18)}
.scanframe{position:relative;margin:auto;width:min(300px,80vw);height:190px;flex:none}
.scanframe i{position:absolute;width:34px;height:34px;border:4px solid #fff}
.scanframe i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}.scanframe i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.scanframe i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 14px}.scanframe i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.scanline{position:absolute;left:14px;right:14px;top:50%;height:2px;background:#E5484D;box-shadow:0 0 12px #E5484D}
.scanhint{position:relative;text-align:center;font-size:15px;color:#C9CDD3;padding:0 32px}
.scanpanel{position:relative;margin:12px 16px max(env(safe-area-inset-bottom,0px),20px);display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow:auto}
.scanpanel .card{background:rgba(22,24,28,.96);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.scanbtn2{height:52px;border-radius:16px;background:rgba(255,255,255,.18);font-weight:600;font-size:15px;width:100%}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--seam);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--dust);flex:none}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td{padding:10px 0;border-top:1px solid var(--seam);vertical-align:top}
tr:first-child td{border-top:0}
td:last-child{text-align:right}

/* ---------- En-tête et barre chargée (signature) ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 4px}
.date{font-family:var(--f-show);font-weight:800;font-size:28px;line-height:1}
.date small{display:block;font:500 13px var(--f-text);color:var(--dust);margin-top:4px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--deck2);display:grid;place-items:center;font:800 18px var(--f-show);position:relative}
.avatar .dot{position:absolute;right:1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--floor);display:none}
.avatar .dot.busy{display:block;background:var(--chalk);animation:pulse 1s ease-in-out infinite}.avatar .dot.off{display:block}
.avatar .dot.off{background:var(--bad)}  /* à jour : pas de pastille ; en cours : blanche qui pulse ; pas synchronisé : rouge */
@keyframes pulse{50%{opacity:.35}}
.rack{margin:18px -16px 0;padding:0 0 0 0;overflow:hidden}
.rack svg{display:block;width:100%;height:auto}
.plate{transform-box:fill-box;transform-origin:center}
.loaded .plate{animation:slide .7s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes slide{from{transform:translateX(160px);opacity:0}to{transform:none;opacity:1}}
.totalrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:6px}
.ris{text-align:right}
.liftrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--seam)}
.liftrow button{text-align:left;min-width:0}
.ris b{display:block}

/* ---------- Carte séance du jour ---------- */
.today{position:relative;background:var(--deck);border-radius:var(--r-lg);padding:18px 16px 16px;overflow:hidden}
.today::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--c1,var(--seam)),var(--c2,var(--seam)))}
.lifts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.duo>*{background:var(--deck);border-radius:var(--r-lg);padding:14px;min-width:0;text-align:left}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center;margin-top:8px}
.stepper input{text-align:center;font:800 26px var(--f-show);padding:6px 4px}
.stepper button{height:44px;border-radius:var(--r-sm);background:var(--deck2);font:600 22px var(--f-text)}
.stepper.big{grid-template-columns:56px 1fr 56px;gap:8px;margin-top:12px}.stepper.big button,.stepper.big input{height:56px}.stepper.big input{font-size:32px}
.insight{display:flex;gap:12px;align-items:flex-start;padding:14px 0;margin-top:14px;border-top:1px solid var(--seam);border-bottom:1px solid var(--seam)}
.insight svg{flex:none;margin-top:2px}

/* ---------- Séance : grille du bloc ---------- */
.grid-bloc{display:grid;gap:6px;margin-top:10px}
.grid-bloc .h{font:600 12px var(--f-text);color:var(--dust);text-align:center;align-self:end}
.grid-bloc .wk{font:800 17px var(--f-show);color:var(--dust);align-self:center}
.cell{height:46px;border-radius:var(--r-sm);background:var(--deck2);color:var(--dust);font:600 12px/1.15 var(--f-text);display:grid;place-items:center;text-align:center}
.cell.done{background:var(--deck);color:var(--faint)}
.cell.next{box-shadow:inset 0 0 0 2px var(--chalk);color:var(--chalk)}
.cell[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--chalk);color:var(--chalk)}
.exo{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--seam);align-items:center;width:100%;text-align:left}
.exo:first-child{border-top:0}
.exo .bar-v{width:10px;height:10px;border-radius:50%;background:var(--c,var(--deck3));flex:none}
.exo .grow{flex:1;min-width:0}
.done-sets{font-size:13px;color:var(--steel-hi);margin-top:3px}

/* ---------- Pages superposées ---------- */
.page,.live{position:fixed;inset:0;background:var(--floor);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px));
  animation:pageIn .28s cubic-bezier(.2,.8,.2,1)}
.page>.wrap,.live>.wrap{max-width:560px;margin:0 auto}
@keyframes pageIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.pagebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 12px;position:sticky;top:calc(-1 * env(safe-area-inset-top,0px) - 8px);background:var(--floor);z-index:2}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--deck2);display:grid;place-items:center;flex:none}
.live{z-index:40}
.live-progress{display:flex;gap:3px;margin:4px 0 16px}
.live-progress i{flex:1;height:4px;border-radius:3px;background:var(--deck2)}
.live-progress i.on{background:var(--c,var(--chalk))}
.live-progress i.cur{background:var(--chalk)}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:6px}
.sets th{font:500 12px var(--f-text);color:var(--dust);text-align:left;padding:0 4px}
.sets td{border:0;padding:0 4px;text-align:left}
.sets td:first-child{font:800 22px var(--f-show);color:var(--dust);width:34px}
.sets input{text-align:center;font:800 24px var(--f-show);padding:8px 4px}
.sets tr.done input{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--deck2))}
.check{width:48px;height:48px;border-radius:50%;border:2px solid var(--seam);display:grid;place-items:center;color:transparent}
tr.done .check{background:var(--ok);border-color:var(--ok);color:#10261a}
.rpe{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.rpe button{flex:none;min-width:48px;height:44px;border-radius:12px;background:var(--deck);font:700 19px var(--f-show);color:var(--steel-hi)}
.rpe button[aria-pressed="true"]{background:var(--chalk);color:var(--floor)}
.rpecible{display:flex;flex-direction:column;gap:2px;border:2px solid var(--chalk);border-radius:var(--r);padding:10px 14px;margin-top:10px;font-size:14px}.rpecible b{font:700 17px var(--f-text)}.rpecible span{color:var(--dust)}
.rpecible.over{border-color:var(--bad)}.rpecible.over span{color:var(--bad)}.rpe button.tgt{box-shadow:inset 0 0 0 2px var(--chalk)}
.coachnote{background:var(--deck);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-top:10px}
.prev{font-size:13px;color:var(--dust);margin-top:6px}

/* ---------- Feuilles (minuteur, réglages, bilan) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.6);z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--deck);border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));animation:up .3s cubic-bezier(.2,.9,.2,1)}
.sheet>.wrap{max-width:560px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--seam);margin:0 auto 12px}
@keyframes up{from{transform:translateY(100%)}}
.timer{display:grid;place-items:center;position:relative;margin:6px auto 4px;width:220px;height:220px}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer .show{font-size:68px}
.timer.over .show{color:var(--chalk)}
.score{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.score button{height:38px;border-radius:8px;background:var(--deck2);font:800 17px var(--f-show);color:var(--dust)}
.score button[aria-pressed="true"]{background:var(--chalk);color:var(--floor)}

/* ---------- Échelle d'objectif ---------- */
.scale{display:flex;height:30px;border-radius:9px;overflow:hidden;position:relative;margin-top:14px}
.scale span{display:grid;place-items:center;font:600 11px var(--f-text);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.scale .mk{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;border-radius:2px;background:var(--chalk);box-shadow:0 0 0 2px var(--deck)}
.scale-lbl{position:relative;height:18px;font:500 12px var(--f-text);color:var(--dust);font-variant-numeric:tabular-nums;margin-top:4px}
.scale-lbl b{position:absolute;transform:translateX(-50%);font-weight:500;white-space:nowrap}
.verdict{display:flex;gap:12px;margin-top:14px}
.verdict .ic{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none;background:var(--vc)}

/* ---------- Calendrier ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font:600 12px var(--f-text);color:var(--dust);padding:4px 0}
.cal .d{position:relative;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font:600 14px var(--f-text);font-variant-numeric:tabular-nums}
.cal .d.out{color:var(--faint)}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--chalk)}
.cal .d.comp{background:var(--comp);color:#fff}
.cal .d.comp.tbc{background:color-mix(in srgb,var(--comp) 35%,var(--deck2));color:var(--chalk)}
.cal .d i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--chalk)}
.cal .d i.todo{background:none;box-shadow:inset 0 0 0 1.5px var(--dust)}
.check-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--seam);width:100%;text-align:left}
.check-row:first-child{border-top:0}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--seam);display:grid;place-items:center;flex:none;color:transparent}
.check-row[aria-checked="true"] .box{background:var(--chalk);border-color:var(--chalk);color:var(--floor)}
.check-row[aria-checked="true"] span{color:var(--dust);text-decoration:line-through}
.att{display:grid;grid-template-columns:90px repeat(3,1fr);gap:6px;align-items:center;margin-top:8px}
.att input{text-align:center;font:800 20px var(--f-show);padding:8px 2px}
.att .res{display:flex;justify-content:center;gap:4px;margin-top:4px}
.att .res button{width:28px;height:24px;border-radius:6px;background:var(--deck2);font:700 12px var(--f-text);color:var(--dust)}
.att .res button[aria-pressed="true"].y{background:var(--ok);color:#10261a}
.att .res button[aria-pressed="true"].n{background:var(--bad);color:#2a0d0a}

/* ---------- Barre d'onglets ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--floor) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--seam);
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(4px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;min-height:48px;font:600 11px var(--f-text);color:var(--dust);transition:color .2s}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--chalk)}
.tabs button[aria-current="page"] svg{color:var(--chalk)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,calc(-100% - 160px));z-index:60;background:var(--chalk);color:var(--floor);

.fcells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;margin-top:12px}.fcell{min-height:68px;border:0;border-radius:14px;background:var(--deck2);color:var(--chalk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font:inherit}.fcell b{font-size:18px}.fcell span{font-size:11px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fcell.done{color:var(--steel-hi)}.fcell.next{background:var(--brand);color:#fff}.fbar{height:6px;border-radius:3px;background:var(--deck3);margin-top:12px}.fbar i{display:block;height:6px;border-radius:3px;background:var(--steel-hi)}
.slots{display:flex;flex-direction:column;gap:8px}.slotc{background:var(--deck);border-radius:16px;padding:8px 8px 8px 14px}.slotc.cur{box-shadow:inset 0 0 0 1.5px var(--deck3)}.slotrow{display:flex;align-items:center;gap:12px;min-height:56px}.sloti{width:40px;height:40px;border-radius:12px;background:var(--deck2);color:var(--dust);display:flex;align-items:center;justify-content:center;flex:none}.iconbtn.plus{width:44px;height:44px;border-radius:22px;background:var(--chalk);color:var(--floor);font-size:24px;font-weight:700;flex:none}.slotc .list{margin-top:4px}

.replay{display:flex;gap:10px;overflow-x:auto;margin:8px -16px 0;padding:0 16px 4px;scrollbar-width:none}.replay::-webkit-scrollbar{display:none}.rcard{flex:0 0 132px;min-height:96px;border:0;border-radius:16px;background:var(--deck);color:var(--chalk);padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-family:inherit}.rcard:active{transform:scale(.97)}.rcard .rname{font-size:13px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rcard .rk{font:800 24px var(--f-show)}.rcard .rk small{font:500 12px var(--f-text);color:var(--dust)}
.restpill{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:45;max-width:536px;margin:0 auto;background:#fff;color:var(--floor);border-radius:28px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:up .35s var(--ease)}

   nom de l'onglet et filet quand on fait défiler. */
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:52px;position:sticky;top:0;z-index:25;padding:calc(env(safe-area-inset-top,0px) + 4px) 0 4px}

html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}

    $("#impres").innerHTML = `<p class="small muted" style="margin-top:12px">Lecture de l'archive…</p>`;
    try {
      if (!window.JSZip) await new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
      const z = await JSZip.loadAsync(file), names = Object.keys(z.files).filter(n => /\.csv$/i.test(n));
      const pick = names.find(n => /measure|mesure|weight|poids/i.test(n)) || names[0];
      if (!pick) { $("#impres").innerHTML = `<p class="small" style="margin-top:12px;color:var(--bad)">Aucun fichier CSV dans l'archive.</p>`; return; }
      return parseImport(await z.file(pick).async("string"));

function parseImport(raw){

    const sep = [",", ";", "\t"].sort((a, b) => lines[0].split(b).length - lines[0].split(a).length)[0], split = l => l.split(sep).map(x => x.replace(/^"|"$/g, "").trim());
    const head = split(lines[0]).map(h => h.toLowerCase()); let di = head.findIndex(h => /date|jour/.test(h)), wi = head.findIndex(h => /weight|poids|body ?mass/.test(h));
    const lb = head.some(h => /\blbs?\b|pound/.test(h)), rows = [];
    for (const l of lines.slice(1)) { const c = split(l); if (di < 0) di = 0; if (wi < 0) wi = c.findIndex((x, i) => i !== di && num(x) > 20 && num(x) < 600);
      let w = num(c[wi]); if (!w) continue; let iso = toIso(c[di] || "");
      if (!iso) { const m = (c[di] || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) iso = m[3] + "-" + m[1].padStart(2, "0") + "-" + m[2].padStart(2, "0"); }
      if (!iso) { const t = new Date(c[di]); if (!isNaN(t)) iso = isoOf(t); } if (!iso) continue; if (lb) w *= 0.45359237; if (w > 25 && w < 250) rows.push([iso, Math.round(w * 10) / 10]); }
    const have = new Set(D.poids.map(p => p.date)), fresh = rows.filter(r => !have.has(r[0])); importRows = fresh; const ds = rows.map(r => r[0]).sort();

      : `<p class="small" style="margin-top:12px;color:var(--bad)">Aucune pesée reconnue. Le fichier doit contenir une colonne date et une colonne poids.</p>`;
  }
}

async function startScan(){
  stopScan(); scanSt = "cam"; const v = document.getElementById("scanv"); if (!v) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return scanPanel("nocam", false);
  try { scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}, audio:false}); }
  catch(e){ return scanPanel("nocam", !!e && e.name === "NotAllowedError"); }
  if (sheet !== "scan") return stopScan();
  v.srcObject = scanStream; try { await v.play(); } catch(e){}
  try { scanDet = "BarcodeDetector" in window ? new BarcodeDetector({formats:["ean_13", "ean_8", "upc_a"]}) : null; } catch(e){ scanDet = null; }
  if (!scanDet) { try { await loadZX(); } catch(e){ return scanPanel("nocam", false); } }
  const cv = document.createElement("canvas");
  scanTimer = setInterval(async () => {
    if (scanBusy || scanSt !== "cam" || !v.videoWidth) return; scanBusy = true;
    try {
      let code = null;
      if (scanDet) { const r = await scanDet.detect(v); code = r[0] && r[0].rawValue; }
      else { const w = Math.min(960, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(v, 0, 0, w, h); code = decodeCanvas(cv); }
      if (code && gtinOk(code)) onScanCode(code);
    } catch(e){}
    scanBusy = false;
  }, 220);
}
async function onScanCode(code){
  if (scanSt !== "cam") return; scanSt = "busy"; scanCode = code; try { navigator.vibrate && navigator.vibrate(40); } catch(e){}
  scanPanel("busy");
  let f = null, off = false;
  if (navigator.onLine) { try { f = await offProduct(code); off = true; } catch(e){ f = null; } }
  if ((!f || f.incomplete) && CAT_URL) { const c = await catByCode(code); if (c && !c.incomplete) { f = c; off = true; } }
  if (f && f.incomplete) return scanPanel("incomplete", f);
  if (!f) f = localFood(code);
  if (f) return scanFound(f);
  scanPanel(off ? "notfound" : "offline");
}

let resolvingScans = false;
async function resolveScans(){
  let L = store.get("sl4-scans") || []; if (!L.length || resolvingScans || !navigator.onLine || !D) return; resolvingScans = true;
  try {
    for (const p of [...L]) {
      let f = null; try { f = await offProduct(p.code); } catch(e){ break; }
      if (f && !f.incomplete) { await addJournal(f, p.q, p.date, p.h); toast(f.nom + " ajouté à ta journée"); }
      else toast("Le code " + p.code + " est introuvable ou incomplet : ajoute le produit à la main.", true);
      L = (store.get("sl4-scans") || []).filter(x => !(x.code === p.code && x.at === p.at)); if (L.length) store.set("sl4-scans", L); else store.del("sl4-scans");

/* =====================================================================
   VIDÉOS DES RECORDS : gardées sur ce téléphone (IndexedDB), autant qu'on veut par nombre de reps.
   Rien n'est remplacé : chaque vidéo ajoutée s'ajoute aux précédentes.
   ===================================================================== */
let VIDX = {}, VIDL = null, vidUrls = [], vidDraft = null, vidDel = null;
function vidDb(){ return new Promise((ok, ko) => { const r = indexedDB.open("sl-videos", 1);
  r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", {keyPath:"id"}); if (!db.objectStoreNames.contains("blob")) db.createObjectStore("blob"); };
  r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
/* une transaction = des requêtes lancées d'un coup (pas d'attente au milieu : Safari ferme la transaction) */
async function vidTx(stores, mode, fn){ const db = await vidDb(); return new Promise((ok, ko) => { let out; const t = db.transaction(stores, mode);

    if ((m = t.match(/(\d+(?:[.,]\d+)?)\s*(kg|lbs?)\b/i))) return { kind: "abs", v: num(m[1]), u: m[2].toLowerCase().replace(/s$/, "") };

    if ((m = t.match(/(?<![\d.,])(\d+(?:[.,]\d+)?)\s*%/))) return { kind: "pct", v: num(m[1]) };
    for (const pm of s.matchAll(/\(([^)]*)\)/g)) { if (/\d/.test(pm[1]) && !/\(/.test(pm[1]) && /^\s*[+@]?\s*\d|^\s*bw/i.test(pm[1])) { const r = readLoad(" " + pm[1]); if (r) return r; } }
    if ((m = s.match(/\((\d{2,3}(?:[.,]\d+)?)\s*(kg|lbs?)?\)/i))) return { kind: "abs", v: num(m[1]), u: (m[2] || DEF_U).toLowerCase().replace(/s$/, "") };   // « opener (190) »
    if ((m = t.match(/\s(\d{2,3}(?:[.,]\d+)?)\s*$/))) return { kind: "abs", v: num(m[1]), u: DEF_U };  // « 3x8 80 » en fin de ligne
    if ((m = t.match(/\s(\d{2,3}(?:[.,]\d+)?)\s+(?:@\s*(?:10|[5-9](?:[.,]5)?)|rpe\s*\d+(?:[.,]\d+)?(?:\s*-\s*\d+(?:[.,]\d+)?)?)\s*$/i))) return { kind: "abs", v: num(m[1]), u: DEF_U };  // « 3x3 140 @8 », « 3x3 140 rpe 8 »
    return null;
  }

  // Cardio (v40) : « vélo 10 min », « 20' de marche », « course 25 minutes 4 km ». Seulement si le nom est du cardio :
  // « repos 2 min » ou « EMOM 10 min » ne deviennent pas des exercices.
  const RE_DUR = /(?<![\d.,])(\d+(?:[.,]\d+)?)\s*(minutes?|mins?|mn|h(?:eures?)?|['’])(?![a-zà-ÿ])/i;
  const REST_LIKE = /^(repos|rest|r[ée]cup|pause|break|off)\b/i;
  // « Fractionné 30 min : 6 x 3 min », « EMOM 12 min – 3 burpees + 6 swings », « AMRAP 10 min – 5 pull-ups, 10 push-ups »
  function timedLine(s) {
    const tm = s.match(/^\s*([A-Za-zÀ-ÿ][^\d:–—]{1,40}?)\s+(\d+(?:[.,]\d+)?)\s*(min|minutes?|mn|h|heures?)\s*[:–—-]\s*(.+)$/i);
    if (!tm || REST_LIKE.test(tm[1])) return null;
    const c = canon(tm[1]);
    return c.cat === "cardio" || !c.canon || c.canon === "Conditionnement" ? tm : null;
  }
  function readDuration(s) {
    const m = RE_DUR.exec(s); if (!m) return null;
    const nameOf = t => t.replace(/[:\-—–,;@(){}]+/g, " ").replace(/\s+/g, " ").trim();
    let nm = nameOf(s.slice(0, m.index));
    // lot 2 : « Mobilité 15 min », « Circuit Hyrox 25 min : … » = une activité chronométrée, même hors cardio
    const alone = nm.length >= 4 && /[a-zà-ÿ]{4}/i.test(nm) && !REST_LIKE.test(nm) && (!canon(nm).canon || canon(nm).canon === "Conditionnement") && /^\s*([:–—-].*)?$/.test(s.slice(m.index + m[0].length));
    if (canon(nm).cat !== "cardio" && !alone) nm = nameOf(s.slice(m.index + m[0].length).split(/[,.;]|\s(?:puis|then)\s/i)[0]);
    if (canon(nm).cat !== "cardio" && !alone) return null;
    const min = /^h/i.test(m[2]) ? num(m[1]) * 60 : num(m[1]);
    const km = (s.match(/(?<!(?:environ|env\.|~|≈|approx\.?|about|around|ca\.)\s*)(?<![\d.,])(\d+(?:[.,]\d+)?)\s*km\b/i) || [])[1] || null;   // « environ 16 km » : estimation, pas une consigne
    return { name: nm, groups: [{ sets: 1, reps: String(Math.round(min * 10) / 10).replace(".", ",") + " min", load: null, amrap: false, km: km }], rpe: null, tempo: null, side: false };
  }

  // Renvoie {name, groups, rpe, tempo, note} ou null si aucun schéma.
  let ROUNDS = 0;   // v42 : « circuit de 3 tours » → séries des exercices écrits en reps seules
  function readExo(seg) {
    let s = seg.trim();
    // v42 : « 4 x 10 (12kg) + 10 (6kg) » = dégressif dans chaque série : 1re charge gardée, détail en note
    const drop = s.match(/(\d+)\s*\(\s*(\d+(?:[.,]\d+)?)\s*kg\s*\)\s*\+\s*(\d+)\s*\(\s*(\d+(?:[.,]\d+)?)\s*kg\s*\)/i);
    if (drop) s = s.replace(drop[0], drop[1] + " " + drop[2] + DEF_U);
    s = s.replace(/([x×*])\s*\((\d+\s*-\s*\d+)\)/g, "$1$2");   // « 4×(8-10) »
    s = wordsToDigits(s);
    s = s.replace(/\bavec\s+(\d+(?:[.,]\d+)?)\s*(kg|lbs?)\s+de\s+lest\b/gi, "+$1 $2").replace(/\bwith\s+(\d+(?:[.,]\d+)?)\s*(kg|lbs?)\s+(?:added|extra)\b/gi, "+$1 $2");
    // « Fractionné 30 min : 6 x 3 min vite, récup 2 min » : la durée qui suit le nom est la consigne, le détail va en note
    const tm = timedLine(s);
    if (tm) { const d = readDuration(tm[1] + " " + tm[2] + " " + tm[3]); if (d) return { ...d, note: tm[4].trim() }; }
    const hits = [];
    let m;
    RE_PCT_X.lastIndex = 0;
    while ((m = RE_PCT_X.exec(s))) hits.push({ i: m.index, end: m.index + m[0].length, g: m[3] ? { sets: +m[2], reps: m[3] } : { sets: 1, reps: m[2] }, load: { kind: "pct", v: num(m[1]) }, amrap: !!m[4] });
    RE_SXR.lastIndex = 0;
    while ((m = RE_SXR.exec(s))) {
      if (hits.some(h => m.index < h.end && m.index + m[0].length > h.i)) continue;
      const a = toNum(m[1]); if (a == null || a > 15) continue;
      let reps = /max|amrap/i.test(m[2]) ? "max" : m[2].replace(/\s/g, "");
      if (/\//.test(reps)) { const [x, y] = reps.split("/").map(Number); if (!(x < y)) continue; reps = x + "-" + y; }   // « 8/10 » = 8 à 10
      hits.push({ i: m.index, end: m.index + m[0].length, g: { sets: a, reps }, amrap: reps === "max" || !!m[3] });
    }
    RE_LXR.lastIndex = 0;
    while ((m = RE_LXR.exec(s))) {
      if (hits.some(h => m.index < h.end && m.index + m[0].length > h.i)) continue;
      if (!m[3] && !m[1] && num(m[2]) <= 15) continue;
      hits.push({ i: m.index, end: m.index + m[0].length, g: { sets: 1, reps: m[4] }, amrap: !!m[5], load: { kind: m[1] ? "lest" : "abs", v: num(m[2]), u: (m[3] || DEF_U).toLowerCase().replace(/s$/, "") } });
    }
    RE_REP_AT.lastIndex = 0;
    while ((m = RE_REP_AT.exec(s))) {
      if (hits.some(h => m.index < h.end && m.index + m[0].length > h.i)) continue;
      hits.push({ i: m.index, end: m.index + m[0].length, g: { sets: 1, reps: m[1] }, amrap: !!m[2], load: { kind: "pct", v: num(m[3]) } });
    }
    const add = (re, f) => { re.lastIndex = 0; let q; while ((q = re.exec(s))) { if (hits.some(h => q.index < h.end && q.index + q[0].length > h.i)) continue; const h = f(q); if (h) hits.push({ i: q.index, end: q.index + q[0].length, ...h }); } };
    add(RE_SETS_OF, q => { const a = toNum(q[1]); if (a == null || a > 15) return null; const reps = /max|amrap/i.test(q[2]) ? "max" : q[2].replace(/\s/g, ""); return { g: { sets: a, reps }, amrap: reps === "max" }; });
    add(RE_LIST, q => { const l = q[1].replace(/\s/g, "").split("/"); return { g: { sets: l.length, reps: l.every(x => x === l[0]) ? l[0] : l.join("/") } }; });
    RE_SINGLE.lastIndex = 0;
    while ((m = RE_SINGLE.exec(s))) {
      if (hits.some(h => m.index < h.end && m.index + m[0].length > h.i)) continue;
      const reps = m[3] ? +m[3] : ({ single: 1, double: 2, triple: 3 })[strip(m[2]).replace(/s$/, "")];
      hits.push({ i: m.index, end: m.index + m[0].length, g: { sets: toNum(m[1]) || 1, reps: String(reps) } });
    }
    RE_PROSE.lastIndex = 0;
    while ((m = RE_PROSE.exec(s))) if (!hits.some(h => m.index < h.end && m.index + m[0].length > h.i)) hits.push({ i: m.index, end: m.index + m[0].length, g: { sets: toNum(m[1]), reps: String(toNum(m[2])) } });
    if (!hits.length) {   // v42 : « Tractions : 7 répétitions » (street workout, circuits)
      const q = s.match(/(?<![\d.,])(\d{1,3})\s*(?:r[ée]p[ée]titions?|reps?)\b/i);
      if (q && !/repos|rest\b/i.test(s.slice(0, q.index))) hits.push({ i: q.index, end: q.index + q[0].length, g: { sets: ROUNDS || 1, reps: q[1] } });
    }
    if (!hits.length) return readDuration(s);
    hits.sort((a, b) => a.i - b.i);
    // charge de chaque groupe : texte entre la fin du groupe et le début du suivant
    hits.forEach((h, k) => {
      if (!h.load) { const tail = s.slice(h.end, k + 1 < hits.length ? hits[k + 1].i : s.length); h.load = readLoad(" " + tail) || (k === 0 ? readLoad(" " + s.slice(0, h.i)) : null); }
    });
    let name = s.slice(0, hits[0].i).replace(/\s+(@\s*)?\d+(?:[.,]\d+)?\s*%\s*([:\-—–]\s*)?$/, "").replace(/\s\+\s*\d+(?:[.,]\d+)?\s*(kg|lbs?)?/gi, "").replace(/\d+(?:[.,]\d+)?\s*(kg|lbs?)?\s*$/i, "")
      .replace(/(\s|^)(puis|then|et|ensuite)\s*$/i, "").replace(/[:\-—–,@(>=→|]+\s*$/, "").replace(/\s*(->|=>|→)\s*$/, "").trim();
    const rpe = (s.match(/rpe\s*(\d+(?:[.,]\d+)?(?:\s*-\s*\d+(?:[.,]\d+)?)?)/i) || s.match(/@\s*(10|[5-9](?:[.,]5)?)(?![\d.,]|\s*(?:%|kg|lbs?))/i) || [])[1] || null;
    const tempo = (s.match(/tempo\s*(\d-\d-[\dx](?:-\d)?)/i) || [])[1] || null;
    const side = /\/\s*(jambe|bras|c[oô]t[ée])|par\s*(bras|jambe|c[oô]t[ée])|chaque\s*(bras|jambe|c[oô]t[ée])|\/\s*leg|per side|\d\s*\/\s*c\b/i.test(s);
    hits.forEach(h => { if (!/^\d+$/.test(h.g.reps)) return; const after = s.slice(h.end); if (/^\s*(s|sec|secondes?|seconds?|")(?![a-zà-ÿ])/i.test(after)) h.g = { ...h.g, reps: h.g.reps + " s" }; else if (/^\s*(min|mn|minutes?|')(?![a-zà-ÿ])/i.test(after)) h.g = { ...h.g, reps: h.g.reps + " min" }; });
    const groups = hits.map(h => ({ ...h.g, load: h.load || null, amrap: !!h.amrap }));
    // v42 : lest porté (« pompes lestées … 11 kg », « sac lesté 10kg ») ; indications gardées en note
    if (/lest[ée]|\bsac\b|gilet|ceinture|weighted/i.test(s)) groups.forEach(g => { if (g.load && g.load.kind === "abs") g.load = { ...g.load, kind: "lest" }; });
    const note = [];
    if (drop) note.push(`dégressif : ${drop[1]} reps à ${drop[2].replace(".", ",")} kg puis ${drop[3]} à ${drop[4].replace(".", ",")} kg`);
    else if (/d[ée]gressi|drop\s*set/i.test(s)) note.push(/derni[eè]re/i.test(s) ? "dernière série en dégressif" : "dégressif");
    if (/derni[eè]re\W+(s[ée]rie\W+)?([àa]\s*l.)?[ée]chec/i.test(s)) note.push("dernière série à l'échec");
    else if (/[àa]\s*l.\s*[ée]chec|to failure/i.test(s)) note.push("à l'échec");
    if (/sur\s*chaque/i.test(s)) note.push("sur chaque");
    const ct = s.match(/(\d)\s*ct\b/i); if (ct) note.push("pause " + ct[1] + " temps");
    const alt = s.match(/(\d+(?:[.,]\d+)?)\s*(?:kg|lbs?)?\s*(ou|or)\s*(\d+(?:[.,]\d+)?)\s*(kg|lbs?)\b/i); if (alt) note.push("charge au choix : " + alt[0]);
    return { name, groups, rpe, tempo, side, note: note.join(" · ") || null };
  }

  function mkExo(raw, ex) {
    const c = canon(ex.name);
    // tractions, dips, muscle-up : une charge ajoutée est toujours un lest (on ne fait pas des tractions « à 15 kg »)
    // sauf « tractions assistées 20 kg » : c'est une aide, jamais une charge
    if (["Tractions", "Dips", "Muscle-up"].includes(c.canon)) ex.groups.forEach(g => { if (g.load && g.load.kind === "abs") g.load = /assist/i.test(raw) ? { kind: "assist", v: g.load.v, u: g.load.u } : { ...g.load, kind: "lest" }; });
    return { raw: raw.trim(), name: ex.name || c.canon || "?", canon: c.canon, cat: c.cat, groups: ex.groups, rpe: ex.rpe, tempo: ex.tempo, side: ex.side, note: ex.note || null };
  }

  // Une ligne peut contenir plusieurs exercices (« A / B », « A ; B », « A 3x12, B 3x12 »).
  const ADD_ON = /^(back.?off|top\s*set|warm.?up|[ée]chauff\w*|puis|then|et|ensuite|pareil)\b/i;
  function readExoLine(line) {
    const out = [];
    if (timedLine(line)) { const ex = readExo(line); if (ex) return [mkExo(line, ex)]; }
    // v42 : « Nom / 4 x 8 / 50kg » (notes téléphone) : le nom, le schéma et la charge sont recollés ;
    // « A 3x12 / B 3x12 » reste deux exercices.
    const LOADISH = /^(-\s*\d|\d+(?:[.,]\d+)?\s*(kg|lbs?)\b|\d+(?:[.,]\d+)?$|kg\b|lbs?\b|pdc\b|bw\b|poids\s*du\s*corps|[ée]lastique|\+|halt|barre\b|machine\b)/i;
    const hasNm = ex => ex && ex.name && /[a-zà-ÿ]{2,}/i.test(ex.name) && !ADD_ON.test(ex.name.trim());
    const bigs = []; let pend = null;
    for (const t of line.split(/\s+\/\s*|\s*\/\s+|\s*;\s*/).map(x => x.trim())) {
      if (!t) continue;
      const ex = readExo(t);
      if (ex && !hasNm(ex) && pend != null) { bigs.push(pend + " : " + t); pend = null; continue; }
      if (!ex && LOADISH.test(t) && bigs.length && pend == null) { bigs[bigs.length - 1] += " " + (/^-\s*\d/.test(t) ? "assistance " + t.replace(/^-\s*/, "") : t); continue; }
      if (pend != null) { bigs.push(pend); pend = null; }
      if (!ex && /[a-zà-ÿ]{2,}/i.test(t)) { pend = t; continue; }
      bigs.push(t);
    }
    if (pend != null) bigs.push(pend);
    for (const big of bigs) {
      const parts = big.split(/,\s+/);
      let cur = null, pending = "";
      for (const p0 of parts) {
        const p = pending ? pending + " " + p0 : p0;
        const ex = readExo(p);
        if (!ex) { if (cur) cur.raw += ", " + p0; else if (canon(p0).canon) pending = p0; continue; }
        pending = "";
        let name = ex.name;
        // « then 3x10 incline DB 60lb » : le nom est après le schéma
        if (!canon(name).canon) {
          const after = p.replace(/^.*?\d\s*[x×]\s*(\d+|max|amrap)\+?/i, "").replace(/\d+(?:[.,]\d+)?\s*(kg|lbs?|%)/gi, "");
          if (canon(after).canon && !ADD_ON.test(after.trim())) { ex.name = after.trim(); name = ex.name; }
        }
        const hasName = name && /[a-zà-ÿ]{2,}/i.test(name) && !ADD_ON.test(name.trim());
        if (hasName && (canon(name).canon || !cur)) { cur = mkExo(p, ex); out.push(cur); }
        else if (cur) { cur.groups.push(...ex.groups); cur.raw += ", " + p0; if (!cur.rpe) cur.rpe = ex.rpe; }
        else { cur = mkExo(p, ex); out.push(cur); }
      }
    }
    return out;
  }

  // ---------- titres de jour / semaine ----------
  function readHeader(line) {
    const l = line.replace(/\*\*|__/g, "").trim();
    let m;
    if ((m = l.match(/^(sem(?:aines?)?|weeks?|s)\s*(\d+)\b\s*(\([^)]*\))?\s*[:\-—]?\s*(.*)$/i)) && !/^s\s*\d+\s*x/i.test(l)) {
      const up = (m[4] || "").match(/^(?:à|a|au|-|–|to)\s*(\d+)\b\s*[:\-—]?\s*(.*)$/i);   // v42 : « Semaine 1 à 3 »
      return { type: "week", label: (strip(m[1]).startsWith("w") ? "Week " : "Semaine ") + m[2], key: "w" + m[2], rest: up ? up[2] : m[4], extra: m[3] || "", upto: up && +up[1] > +m[2] && +up[1] - +m[2] < 12 ? +up[1] : null };
    }
    if ((m = l.match(/^(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b\s*[:\-—–,]?\s*(.*)$/i)))
      return { type: "day", label: DAYS[strip(m[1])], key: DAYS[strip(m[1])], rest: m[2] };
    if ((m = l.match(/^(lun|mar|mer|jeu|ven|sam|dim)\.?\s+(.*)$/i)) && /\d/.test(m[2]))
      return { type: "day", label: DAYS[strip(m[1])], key: DAYS[strip(m[1])], rest: m[2] };
    if ((m = l.match(/^(mon|tues?|wed|thu(?:rs?)?|fri|sat|sun)\b\.?\s*(?:[:\-—–]\s*)?(.*)$/i)) && (/^[A-Z]{3}/.test(l) || /^\w+\.?\s*([:\-—–]|$)/.test(l))) {
      const d = { mon: "Lundi", tue: "Mardi", tues: "Mardi", wed: "Mercredi", thu: "Jeudi", thur: "Jeudi", thurs: "Jeudi", fri: "Vendredi", sat: "Samedi", sun: "Dimanche" }[strip(m[1])];
      return { type: "day", label: d, key: d, rest: m[2] };
    }
    if ((m = l.match(/^(L|Ma|Me|M|J|V|S|D)\s*[:\-—–]\s*([^\d]{2,30})$/)) && !/\d/.test(m[2]))   // « L : Push », « J : Legs »
      return { type: "day", label: l, key: l, rest: "" };
    if ((m = l.match(/^(day|jours?|j)\s*(\d+)\b\s*(.*)$/i)))
      return { type: "day", label: "Jour " + m[2], key: "Jour " + m[2], rest: m[3].replace(/^(accessor(y|ies)|accessoires?)\s*/i, "").replace(/^[:\-—]\s*/, "") };
    if ((m = (l.match(/^(?:s[ée]ances?|workout|training|routine)\s+([a-z0-9]+)\b\s*(.*)$/i) || l.match(/^entra[iî]nement\s+(\d+|[a-z])\b\s*(.*)$/i))))
      return { type: "day", label: "Séance " + m[1].toUpperCase(), key: "Séance " + m[1].toUpperCase(), rest: m[2] };
    if ((m = l.match(/^(push|pull|legs|leg day|jambes|upper|lower|haut du corps|bas du corps|full ?body)(?![-\w])(?!\s*(?:ups?|overs?|downs?|day\s*\d*\s*:?\s*\d|over)\b)\s*(\d+|[A-Fa-f](?![\w']))?\s*(.*)$/i)) && !/\d\s*(?:[x×]\s*\d|s[ée]ries?|sets?)/i.test(l))
      return { type: "day", split: true, label: (m[1].toUpperCase() + " " + (m[2] || "").toUpperCase()).trim(), key: (m[1].toUpperCase() + " " + (m[2] || "").toUpperCase()).trim(), rest: m[3] };
    return null;
  }

  const NOTES_HDR = /^(notes?|remarques?|tentatives|objectifs?|nutrition|mon avis)\b.*:?\s*$/i;

  // ---------- tableau collé ----------
  // v42 : en-tête reconnu par « Exercice » ou par « Séries » + « Reps » (tableau de coach copié, colonne du nom sans titre) ;
  // plusieurs tableaux empilés sous « SEANCE n » ; colonnes « Semaine 1, 2… » = résultats notés (gardés en note).
  const isHeadRow = r => r.some(c => /^exerci[cs]es?$/i.test(c)) || (r.some(c => /^(s[ée]ries?|sets?)$/i.test(c)) && r.some(c => /^(reps?|r[ée]p[ée]titions?)$/i.test(c)));
  function tableCols(r) {
    const H = r.map(c => strip(c));
    const col = re => H.findIndex(c => re.test(c));
    const C = { w: col(/^(semaine|week|sem)\.?$/), d: col(/^(jour|day|seance)/), e: col(/^exerci/), s: col(/^(series?|sets?)$/), r: col(/^(reps?|repetitions?)$/),
      p: col(/%|charge|load|kg|poids/), ch: col(/charge|load|^kg$|\(kg\)|poids|weight/), pc: col(/%|pourcent/), rpe: col(/rpe/), rest: col(/repos|rest/), n: col(/note|remarque/),
      res: H.map((h, i) => /^(semaine|week|sem|s)\s*\d+$/.test(h) ? i : -1).filter(i => i >= 0), H: r };
    if (C.e < 0) C.e = C.s > 0 ? C.s - 1 : 0;
    return C;
  }
  function cellLoad(pcell, isPct) {
    if (!pcell || pcell === "-" || !/\d/.test(pcell)) return null;
    if (isPct && /^\s*\d+(?:[.,]\d+)?\s*%?\s*$/.test(pcell)) return { kind: "pct", v: pctVal(pcell) };
    return /bw\s*\+/i.test(pcell) ? { kind: "lest", v: num(pcell.replace(/bw\s*\+/i, "")), u: DEF_U }
      : /%/.test(pcell) ? { kind: "pct", v: num(pcell) } : /^\d/.test(pcell) ? { kind: "abs", v: num(pcell), u: /lb/i.test(pcell) ? "lb" : /kg/i.test(pcell) ? "kg" : DEF_U } : null;
  }
  function parseTable(lines, res, d) {
    const rows = lines.map(l => l.split(d).map(c => c.trim()));
    const hi = rows.findIndex(isHeadRow);
    if (hi < 0) return false;
    let curWeek = null, curDay = null;
    const single = r => { const f = r.filter(Boolean); return f.length === 1 ? readHeader(cleanLine(f[0])) : null; };

  if (!/\.ics$/i.test(filename) && navigator.canShare && navigator.canShare({files:[f]})) {
    try { await navigator.share({files:[f]}); return {status:"saved"}; } catch(e){ if (e && e.name === "AbortError") throw e; }
  }
  const u = URL.createObjectURL(data), a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000); return {status:"saved"};
}};

async function writeMany(id, data){ return gapi(API + id + "/values:batchUpdate", {method:"POST", body:JSON.stringify({valueInputOption:"RAW", data})}); }
async function ensureTabs(id){
  const have = new Set(await getTitles(id)), miss = Object.keys(TABS).filter(t => !have.has(t));
  if (!miss.length) return;
  await gapi(API + id + ":batchUpdate", {method:"POST", body:JSON.stringify({requests:miss.map(t => ({addSheet:{properties:{title:t}}}))})});
  await writeMany(id, miss.map(t => ({range:t + "!A1", values:[TABS[t]]})));
}
/* Nouvel onglet (programme importé) dans le carnet : création puis écriture groupée. */
async function addProgTab(id, title, rows){
  const r = await gapi(API + id + ":batchUpdate", {method:"POST", body:JSON.stringify({requests:[{addSheet:{properties:{title}}}]})});
  await writeMany(id, [{range:q(title) + "!A1", values:rows.map(r => r.map(v => String(v ?? "")))}]);
  /* Logo de l'app en A1, puis mise en forme (maquette A). Un échec ici n'empêche rien : le programme est déjà écrit. */
  const sid = r && r.replies && r.replies[0] && r.replies[0].addSheet ? r.replies[0].addSheet.properties.sheetId : undefined;
  try { await gapi(API + id + "/values:batchUpdate", {method:"POST", body:JSON.stringify({valueInputOption:"USER_ENTERED", data:[{range:q(title) + "!A1", values:[['=IMAGE("' + location.origin + location.pathname.replace(/[^/]*$/, "") + 'icon-192.png";4;56;56)']]}]})}); } catch(e){ console.warn("logo", e); }
  if (sid === undefined) return;
  const style = noFont => gapi(API + id + ":batchUpdate", {method:"POST", body:JSON.stringify({requests:ProgImport.sheetStyle(rows, sid, noFont)})});
  try { await style(false); } catch(e){ try { await style(true); } catch(e2){ console.warn("mise en forme", e2); } }
}
async function createBook(p){
  const r = await gapi(API, {method:"POST", body:JSON.stringify({properties:{title:"Street Lifting – " + (p.prenom || "carnet"), locale:"fr_FR"},
    sheets:Object.keys(TABS).map(t => ({properties:{title:t, gridProperties:{frozenRowCount:1}}}))})});
  const id = r.spreadsheetId;
  /* v28 : catégories automatiques d'après la pesée (modifiables dans les réglages) ; plus de « muscle-up acquis » */
  const prof = [["prenom",p.prenom],["sexe",p.sexe],["naissance",p.naissance || ""],["taille_cm",p.taille || ""],["categorie",p.categorie],["categorie_auto","OUI"],["categorie_ipf_auto","OUI"],
    ["disciplines",p.disciplines || "street"],["power_mode",p.power_mode || "classic"],["coach_sheet_id",p.coach || ""],["bloc_actif",p.bloc || ""],
    ["debut_street",p.debut || ""],["debut_coaching",p.debutCoach || ""],["pays",p.pays || "BE"]];
  const data = Object.keys(TABS).map(t => ({range:t + "!A1", values:[TABS[t]]}));
  data.push({range:"PROFIL!A2", values:prof});
  const eqm = p.power_mode === "equipped" && /power/.test(p.disciplines || "");
  const prs = ALL_LIFTS.filter(l => num(p["pr_" + l]) !== null && String(p["pr_" + l]).trim() !== "").map(l => [isoOf(new Date()), l, num(p["pr_" + l]), 1, p.coach && obPre ? "Max de la prog du coach" : "Saisi à l'inscription", "", eqm && POWER_LIFTS.includes(l) ? "EQ" : ""]);
  if (prs.length) data.push({range:"PR!A2", values:prs});
  if (num(p.poids)) data.push({range:"POIDS!A2", values:[[isoOf(new Date()), num(p.poids), ""]]});
  if (p.bloc && p.blocDate) data.push({range:"BLOCS!A2", values:[[p.bloc, p.blocDate, "saisi à l'inscription"]]});
  await writeMany(id, data);
  return id;
}

function parseCoachProfile(v){
  const out = {}, cell = (r, c) => String((v[r] && v[r][c]) ?? "").trim();
  const numRight = (r, c) => { for (let k = c + 1; k <= c + 3; k++) { const t = cell(r, k); if (t !== "" && num(t) !== null) return num(t); } return null; };
  const MAP = {MU:"MU", "MUSCLE UP":"MU", PU:"PULL", "PULL UP":"PULL", TRACTIONS:"PULL", DIPS:"DIP", DIP:"DIP", SQUAT:"SQUAT", BENCH:"BENCH", "BENCH PRESS":"BENCH", BP:"BENCH", DC:"BENCH", DEADLIFT:"DEADLIFT", DL:"DEADLIFT", SDT:"DEADLIFT"};
  for (let r = 0; r < v.length; r++) for (let c = 0; c < (v[r] || []).length; c++) {
    const t = norm(cell(r, c));
    if (t === "MAX ACTUELS" && out.max === undefined) { out.max = true;
      for (let rr = r + 1; rr < Math.min(v.length, r + 8); rr++) { const k = MAP[norm(cell(rr, c))]; if (k) { const n = numRight(rr, c); if (n) out["pr_" + k] = n; } } }
    if (t === "POIDS" && out.poids === undefined) out.poids = numRight(r, c) ?? undefined;
    if (t === "TAILLE" && out.taille === undefined) { const n = numRight(r, c); if (n) out.taille = n < 3 ? Math.round(n * 100) : n; }
  }
  delete out.max;
  if (out.poids) { const c = CATS.find(x => x < 0 && out.poids <= -x); out.categorie = c ?? CATS.at(-1); }
  return out;
}
function prenomOf(title){
  const w = String(title || "").trim().split(/\s+/).filter(Boolean); if (!w.length) return "";
  const p = w.filter(x => x !== x.toUpperCase()); const n = (p.length ? p : [w.at(-1)]).join(" ");
  return n.charAt(0).toUpperCase() + n.slice(1).toLowerCase();
}

async function fetchEmail(){
  if (cfg().email) return;
  try { const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {headers:{Authorization:"Bearer " + auth.tok}}); const j = await r.json(); if (j.email) setCfg({email:j.email}); } catch(e){}
}

/* =====================================================================
   SYNCHRO ET DÉMARRAGE
   ===================================================================== */
async function syncAll(silent){
  if (syncing || !APP_ID) return; syncing = true; setDot("busy");
  try {
    /* La liste des onglets de la prog est lue en même temps que le carnet (le lien de la prog est déjà connu). */
    const cid0 = D && coachId(), pt = cid0 ? progTabs(cid0).catch(() => null) : null;
    await loadApp(); render();
    try { if (coachId()) await loadCoach(cid0 && cid0 === coachId() ? pt : null); else { S = []; loadedBlocs.clear(); weekMeta = {}; blocNames = {}; progOrder = []; allLoaded = true; } seanceErr = ""; if (coachId() && !S.length) seanceErr = "Ta prog est connectée, mais aucune séance n'y a été reconnue : son tableau n'a pas un format géré par l'app. Envoie le lien de ton Sheet à Alane."; } catch(e){ seanceErr = "Impossible de lire ta prog : " + errMsg(e); }
    lastSync = Date.now(); setDot(seanceErr ? "off" : "ok"); saveCache(); render();
    if (clOn()) clSync().then(() => { if (tab === "agenda" && agendaSeg === "amis" && !sheet) rAgenda(); }).catch(() => {});
    if (seanceErr && S.length) toast(seanceErr, true);
    if (!silent) toast("Données à jour");
    if (!seanceErr) ensureAllBlocs().then(() => { if (tab !== "seance" && !live) render(); }).catch(() => {});
  } catch(e){ setDot("off"); if (!D) fatal(isOffline(e) ? "Pas de réseau, et rien n'est encore gardé sur ce téléphone : ouvre l'app une première fois avec du réseau." : errMsg(e)); else if (isOffline(e)) { if (!silent) toast("Pas de réseau : tu travailles avec les données de ton téléphone."); } else toast(errMsg(e), true); }
  finally { syncing = false; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && D) { flushOutbox().finally(() => { if (Date.now() - lastSync > 60000 && !live) syncAll(true); }); } });
setInterval(() => { if (document.visibilityState === "visible" && D) { flushOutbox().finally(() => { if (Date.now() - lastSync > 10 * 60000 && !live) syncAll(true); }); } }, 60000);
function fatal(msg){ $("#v-home").innerHTML = `<div class="empty"><p>${esc(msg)}</p><button class="btn ghost sm" data-act="boot">Réessayer</button><button class="btn ghost sm" data-act="switchBook">Changer de carnet</button></div>`; }
ACT.boot = () => boot();
ACT.relogin = () => { if (live) persistLive(); auth.login(); };
async function startApp(){
  document.body.classList.remove("ob");
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "v-" + tab);
  $("#v-home").innerHTML = `<div class="skel" style="height:190px;margin-top:18px"></div><div class="skel" style="height:150px;margin-top:14px"></div>`;
  const cached = loadCache(); if (cached) { render(); autoResume(); }
  if (!auth.tok) {
    setDot("off");
    /* Accès Google expiré : on laisse d'abord s'afficher les dernières données (2 images), puis on renouvelle l'accès. */
    if (navigator.onLine && !auth.err) { if (cached) return requestAnimationFrame(() => requestAnimationFrame(() => auth.login())); return auth.login(); }
    if (auth.err) toast("Connexion Google refusée. Réglages, Se reconnecter.", true);
    if (!cached) fatal(auth.err ? "Connexion Google refusée ou annulée." : "Pas de connexion internet. Reviens quand tu as du réseau.");
    return;
  }
  fetchEmail();
  await syncAll(true);
  if (store.get("sl-resume")) { store.del("sl-resume"); const lv = store.get(ck("sl4-live")); if (!live && lv && seanceByKey(lv.key)) startLive(lv.key); }
}
async function boot(){
  auth.fromHash();
  if (!/\.apps\.googleusercontent\.com$/.test(CLIENT_ID)) return onboard("config");
  APP_ID = cfg().appId || "";
  if (APP_ID) return startApp();
  if (!auth.tok) return onboard("login", auth.err ? "Connexion annulée (" + auth.err + "). Réessaie." : "");
  fetchEmail(); onboard("carnet");
}
boot();
/* Mises à jour : l'app s'ouvre depuis le téléphone ; si une nouvelle version arrive, elle s'installe
   tout de suite si tu n'as encore rien touché, sinon un bandeau te la propose (jamais pendant une séance). */
const T0 = Date.now(); let touched = false, updShown = false;
addEventListener("pointerdown", () => { touched = true; }, {once:true, capture:true});
function newVersion(){
  if (live || updShown || auth.leaving) return;
  let last = 0; try { last = +sessionStorage.getItem("sl-upd") || 0; } catch(e){}
  if (!touched && Date.now() - T0 < 4000 && !sheet && !page && Date.now() - last > 60000) { try { sessionStorage.setItem("sl-upd", Date.now()); } catch(e){} return location.reload(); }
  updShown = true; const b = document.createElement("div"); b.className = "upd"; b.setAttribute("role", "status");
  b.innerHTML = 'Nouvelle version prête <button type="button">Mettre à jour</button>'; b.querySelector("button").onclick = () => location.reload();
  document.body.appendChild(b);
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "sl-update") newVersion(); });
}
</script>
