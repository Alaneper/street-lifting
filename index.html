<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Street Lifting">
<meta name="description" content="Suivi de street lifting : PR, total, RIS, prog du coach, poids de corps et compétitions.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png">
<title>Street Lifting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Direction v5 (références : Whoop, Hevy, TrainingPeaks, Garmin) : fond presque noir, cartes sombres,
   un chiffre héros par écran, la couleur réservée aux 4 mouvements. Action principale en blanc craie.
   Palette des disques validée daltonisme sur fond sombre : MU or, tractions bleu, dips sarcelle, squat rouge.
   Échelle : espacements 4/8/12/16/24, rayons 12/16/22, texte 11/12/13/15/17 + titres Big Shoulders. */
:root{
  color-scheme:dark;
  --floor:#0A0B0D; --deck:#16181C; --deck2:#1F2227; --deck3:#2A2E34; --seam:#1C1F24;
  --chalk:#FFFFFF; --dust:#8A9099; --faint:#5E646D; --steel:#8E9198; --steel-hi:#B4BAC2; --brand:#1F5FD0;
  --mu:#E3B341; --pull:#4C8DF6; --dip:#2BB673; --squat:#F0524A;
  --go:#FFFFFF; --comp:#1F5FD0; --ok:#2BB673; --warn:#E3B341; --bad:#FF6F61;
  --f-show:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-text:"Barlow",-apple-system,"Segoe UI",sans-serif;
  --r-lg:24px; --r:16px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--floor);color:var(--chalk)}
body{font:400 15px/1.45 var(--f-text);padding-block:8px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overscroll-behavior-y:none}
main{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:500 16px var(--f-text);color:var(--chalk);background:var(--deck2);border:1px solid var(--seam);border-radius:var(--r-sm);padding:11px 12px;width:100%}
input::placeholder{color:#6d7077}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
p{margin:0}
h1,h2,h3{margin:0;font-weight:inherit}
.show{font-family:var(--f-show);font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums;line-height:.92}
.t-xl{font-size:72px}.t-l{font-size:44px}.t-m{font-size:30px}.t-s{font-size:22px}
.unit{font-family:var(--f-text);font-size:15px;font-weight:500;color:var(--dust);margin-left:4px;letter-spacing:0}
.muted{color:var(--dust)}.small{font-size:13px}.tiny{font-size:12px}
.h2{font-family:var(--f-text);font-weight:700;font-size:18px;margin:26px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.h2 .muted{font:500 14px var(--f-text)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2>*{min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid3>*{min-width:0}
.panel{background:var(--deck);border-radius:var(--r-lg);padding:16px}
.panel+.panel{margin-top:10px}
.seam{border-top:1px solid var(--seam)}
.disc{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--c) 55%,#000);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-text);padding:4px 9px;border-radius:99px;background:var(--deck2);color:var(--dust);white-space:nowrap}
.pill.go{background:var(--chalk);color:var(--floor)}.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:14px 18px;border-radius:28px;background:var(--chalk);color:var(--floor);font:700 16px var(--f-text);transition:transform .12s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--deck2);color:var(--chalk)}
.btn.line{background:none;border:1px solid var(--seam);color:var(--chalk)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:var(--r-sm)}
.btn:disabled{opacity:.45}
.link{color:var(--chalk);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--seam);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;background:var(--deck2);color:var(--dust);font:600 14px var(--f-text);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{background:#fff;color:var(--floor)}
.bar{height:6px;border-radius:9px;background:var(--deck2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--c,var(--chalk));transition:width .7s cubic-bezier(.2,.8,.2,1)}
label{display:block;font:500 13px var(--f-text);color:var(--dust);margin:12px 0 6px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--seam);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--dust);flex:none}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td{padding:10px 0;border-top:1px solid var(--seam);vertical-align:top}
tr:first-child td{border-top:0}
td:last-child{text-align:right}

/* ---------- En-tête et barre chargée (signature) ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 4px}
.date{font-family:var(--f-show);font-weight:800;font-size:28px;line-height:1}
.date small{display:block;font:500 13px var(--f-text);color:var(--dust);margin-top:4px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--deck2);display:grid;place-items:center;font:800 18px var(--f-show);position:relative}
.avatar .dot{position:absolute;right:1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--floor)}
.avatar .dot.busy{background:var(--warn);animation:pulse 1s ease-in-out infinite}
.avatar .dot.off{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.rack{margin:18px -16px 0;padding:0 0 0 0;overflow:hidden}
.rack svg{display:block;width:100%;height:auto}
.plate{transform-box:fill-box;transform-origin:center}
.loaded .plate{animation:slide .7s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes slide{from{transform:translateX(160px);opacity:0}to{transform:none;opacity:1}}
.totalrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:6px}
.ris{text-align:right}
.liftrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--seam)}
.liftrow button{text-align:left;min-width:0}
.ris b{display:block}

/* ---------- Carte séance du jour ---------- */
.today{position:relative;background:var(--deck);border-radius:var(--r-lg);padding:18px 16px 16px;overflow:hidden}
.today::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--c1,var(--seam)),var(--c2,var(--seam)))}
.lifts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.duo>*{background:var(--deck);border-radius:var(--r-lg);padding:14px;min-width:0;text-align:left}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center;margin-top:8px}
.stepper input{text-align:center;font:800 26px var(--f-show);padding:6px 4px}
.stepper button{height:44px;border-radius:var(--r-sm);background:var(--deck2);font:600 22px var(--f-text)}
.insight{display:flex;gap:12px;align-items:flex-start;padding:14px 0;margin-top:14px;border-top:1px solid var(--seam);border-bottom:1px solid var(--seam)}
.insight svg{flex:none;margin-top:2px}

/* ---------- Séance : grille du bloc ---------- */
.grid-bloc{display:grid;gap:6px;margin-top:10px}
.grid-bloc .h{font:600 12px var(--f-text);color:var(--dust);text-align:center;align-self:end}
.grid-bloc .wk{font:800 17px var(--f-show);color:var(--dust);align-self:center}
.cell{height:46px;border-radius:var(--r-sm);background:var(--deck2);color:var(--dust);font:600 12px/1.15 var(--f-text);display:grid;place-items:center;text-align:center}
.cell.done{background:var(--deck);color:var(--faint)}
.cell.next{box-shadow:inset 0 0 0 2px var(--chalk);color:var(--chalk)}
.cell[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--chalk);color:var(--chalk)}
.exo{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--seam);align-items:center;width:100%;text-align:left}
.exo:first-child{border-top:0}
.exo .bar-v{width:10px;height:10px;border-radius:50%;background:var(--c,var(--deck3));flex:none}
.exo .grow{flex:1;min-width:0}
.done-sets{font-size:13px;color:var(--ok);margin-top:3px}

/* ---------- Pages superposées ---------- */
.page,.live{position:fixed;inset:0;background:var(--floor);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px));
  animation:pageIn .28s cubic-bezier(.2,.8,.2,1)}
.page>.wrap,.live>.wrap{max-width:560px;margin:0 auto}
@keyframes pageIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.pagebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 12px;position:sticky;top:calc(-1 * env(safe-area-inset-top,0px) - 8px);background:var(--floor);z-index:2}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--deck2);display:grid;place-items:center;flex:none}
.live{z-index:40}
.live-progress{display:flex;gap:3px;margin:4px 0 16px}
.live-progress i{flex:1;height:4px;border-radius:3px;background:var(--deck2)}
.live-progress i.on{background:var(--c,var(--chalk))}
.live-progress i.cur{background:var(--chalk)}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:6px}
.sets th{font:500 12px var(--f-text);color:var(--dust);text-align:left;padding:0 4px}
.sets td{border:0;padding:0 4px;text-align:left}
.sets td:first-child{font:800 22px var(--f-show);color:var(--dust);width:34px}
.sets input{text-align:center;font:800 24px var(--f-show);padding:8px 4px}
.sets tr.done input{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--deck2))}
.check{width:48px;height:48px;border-radius:50%;border:2px solid var(--seam);display:grid;place-items:center;color:transparent}
tr.done .check{background:var(--ok);border-color:var(--ok);color:#10261a}
.rpe{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.rpe button{flex:none;min-width:48px;height:44px;border-radius:12px;background:var(--deck);font:700 19px var(--f-show);color:var(--steel-hi)}
.rpe button[aria-pressed="true"]{background:var(--chalk);color:var(--floor)}
.coachnote{background:var(--deck);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-top:10px}
.prev{font-size:13px;color:var(--dust);margin-top:6px}

/* ---------- Feuilles (minuteur, réglages, bilan) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.6);z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--deck);border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));animation:up .3s cubic-bezier(.2,.9,.2,1)}
.sheet>.wrap{max-width:560px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--seam);margin:0 auto 12px}
@keyframes up{from{transform:translateY(100%)}}
.timer{display:grid;place-items:center;position:relative;margin:6px auto 4px;width:220px;height:220px}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer .show{font-size:68px}
.timer.over .show{color:var(--ok)}
.score{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.score button{height:38px;border-radius:8px;background:var(--deck2);font:800 17px var(--f-show);color:var(--dust)}
.score button[aria-pressed="true"]{background:var(--chalk);color:var(--floor)}

/* ---------- Échelle d'objectif ---------- */
.scale{display:flex;height:30px;border-radius:9px;overflow:hidden;position:relative;margin-top:14px}
.scale span{display:grid;place-items:center;font:600 11px var(--f-text);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.scale .mk{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;border-radius:2px;background:var(--chalk);box-shadow:0 0 0 2px var(--deck)}
.scale-lbl{position:relative;height:18px;font:500 12px var(--f-text);color:var(--dust);font-variant-numeric:tabular-nums;margin-top:4px}
.scale-lbl b{position:absolute;transform:translateX(-50%);font-weight:500;white-space:nowrap}
.verdict{display:flex;gap:12px;margin-top:14px}
.verdict .ic{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none;background:var(--vc)}

/* ---------- Calendrier ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font:600 12px var(--f-text);color:var(--dust);padding:4px 0}
.cal .d{position:relative;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font:600 14px var(--f-text);font-variant-numeric:tabular-nums}
.cal .d.out{color:#55585e}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--chalk)}
.cal .d.comp{background:var(--comp);color:#fff}
.cal .d.comp.tbc{background:color-mix(in srgb,var(--comp) 35%,var(--deck2));color:var(--chalk)}
.cal .d i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ok)}
.cal .d i.todo{background:var(--dust)}
.check-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--seam);width:100%;text-align:left}
.check-row:first-child{border-top:0}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--seam);display:grid;place-items:center;flex:none;color:transparent}
.check-row[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok);color:#10261a}
.check-row[aria-checked="true"] span{color:var(--dust);text-decoration:line-through}
.att{display:grid;grid-template-columns:90px repeat(3,1fr);gap:6px;align-items:center;margin-top:8px}
.att input{text-align:center;font:800 20px var(--f-show);padding:8px 2px}
.att .res{display:flex;justify-content:center;gap:4px;margin-top:4px}
.att .res button{width:28px;height:24px;border-radius:6px;background:var(--deck2);font:700 12px var(--f-text);color:var(--dust)}
.att .res button[aria-pressed="true"].y{background:var(--ok);color:#10261a}
.att .res button[aria-pressed="true"].n{background:var(--bad);color:#2a0d0a}

/* ---------- Barre d'onglets ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--floor) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--seam);
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(4px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;font:600 11px var(--f-text);color:var(--faint);transition:color .2s}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--chalk)}
.tabs button[aria-current="page"] svg{color:var(--chalk)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-180%);z-index:60;background:var(--chalk);color:var(--floor);
  padding:11px 16px;border-radius:14px;font:600 14px var(--f-text);width:max-content;max-width:calc(100% - 32px);transition:transform .3s cubic-bezier(.2,.9,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#2a0d0a}
.empty{padding:28px 0;text-align:center;color:var(--dust);display:flex;flex-direction:column;align-items:center;gap:12px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--deck2);border-top-color:var(--go);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--deck) 0%,var(--deck2) 50%,var(--deck) 100%);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:var(--r-lg)}
@keyframes sk{to{background-position:-200% 0}}
.burst{animation:burst .9s cubic-bezier(.2,.9,.2,1)}
@keyframes burst{30%{transform:scale(1.08)}}
canvas{display:block;width:100%}
.src{font-size:12.5px;color:var(--dust);line-height:1.55}
.src a{color:var(--chalk)}
details>summary{cursor:pointer;list-style:none;font-weight:600}
details>summary::-webkit-details-marker{display:none}

/* ---------- v5 : composants ---------- */
.card{background:var(--deck);border-radius:var(--r-lg);padding:16px}
.card+.card,.card+.tiles,.tiles+.card{margin-top:12px}
.eyebrow{font:700 12px var(--f-text);letter-spacing:.08em;text-transform:uppercase;color:var(--dust)}
.rise{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.view>.rise:nth-child(2){animation-delay:.05s}.view>.rise:nth-child(3){animation-delay:.1s}.view>.rise:nth-child(4){animation-delay:.15s}.view>.rise:nth-child(5){animation-delay:.2s}
.exline{display:flex;align-items:center;gap:10px;font-size:15px}
.exline b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exline span:last-child{color:var(--steel-hi);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot8{width:8px;height:8px;border-radius:50%;background:var(--c,var(--faint));flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.week>div{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 11px var(--f-text);color:var(--dust)}
.week .wd{width:100%;max-width:44px;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font:600 13px var(--f-text);color:var(--faint);background:var(--deck)}
.week .wd.plan{background:none;box-shadow:inset 0 0 0 1px var(--deck3);color:var(--steel-hi)}
.week .wd.done{background:var(--chalk);color:var(--floor)}
.week .wd.today{box-shadow:inset 0 0 0 2px var(--c,var(--chalk));color:var(--chalk);font-weight:800}
.week .wd.comp{background:var(--comp);color:#fff}
.week .wd.done.today{color:var(--floor);box-shadow:inset 0 0 0 2px var(--floor),0 0 0 2px var(--c,var(--chalk))}
.ringwrap{position:relative;width:220px;height:186px;margin:2px auto 0}
.ringwrap svg{position:absolute;top:0;left:0}
.ringwrap .ctr{position:absolute;top:56px;left:0;right:0;text-align:center}
.seg{stroke-dasharray:0 754;animation:segIn 1s var(--ease) forwards}
@keyframes segIn{to{stroke-dasharray:var(--len) 754}}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:6px}
.stats3>div{text-align:center;min-width:0}.stats3>div+div{border-left:1px solid var(--seam)}
.stats3 b{display:block;font:800 22px var(--f-show);margin-top:2px;font-variant-numeric:tabular-nums}

async function loadBloc(n){

function fixJours(ss){
  const votes = {};
  ss.forEach(s => { const j = norm(s.jour); if (j in JOUR_IDX) { const o = votes[s.idx] = votes[s.idx] || {}; o[j] = (o[j] || 0) + 1; } });
  const usual = i => { const o = votes[i]; return o ? Object.entries(o).sort((a, b) => b[1] - a[1])[0][0] : null; };
  const weeks = {}; ss.forEach(s => (weeks[s.semaine] = weeks[s.semaine] || []).push(s));
  for (const list of Object.values(weeks)) {
    let prev = -1;
    for (const s of list.sort((a, b) => a.idx - b.idx)) {
      let j = norm(s.jour);
      if (!(j in JOUR_IDX) || JOUR_IDX[j] <= prev) { const u = usual(s.idx); if (u && JOUR_IDX[u] > prev) j = u; }
      if (j in JOUR_IDX) { s.jour = title(j); prev = JOUR_IDX[j]; }
    }
  }
}
function parseBloc(v, sheet, bloc){
  const cell = (r, c) => String((v[r] && v[r][c]) ?? "");
  const seances = [], weeks = {};
  for (let r = 0; r < v.length; r++){
    const width = (v[r] || []).length;
    for (let c = 0; c < width; c++){
      if (norm(cell(r, c)) !== "MOUVEMENT") continue;
      const cols = {};
      for (let k = c; k < Math.min(c + 20, width); k++){ const h = norm(cell(r, k)); if (!h) continue; if (k > c && h === "MOUVEMENT") break; if (!(h in cols)) cols[h] = k; }
      let seance = "", jour = "", semaine = "", nb = 0;
      for (let up = r - 1; up >= Math.max(0, r - 200); up--){
        const x = norm(cell(up, c));
        if (!seance && !jour && /^S[ÉE]ANCE/.test(x)) seance = cell(up, c).trim();
        if (x === "MOUVEMENT") nb++;
        if (!jour && x === "JOUR") jour = cell(up, c + 1).trim();
        if (x === "SEMAINE") { semaine = cell(up, c + 1).trim(); break; }
      }
      if (!seance) seance = "Séance " + (nb + 1);
      const ex = []; let blanks = 0, last = r;
      for (let rr = r + 1; rr < v.length; rr++){
        const m = norm(cell(rr, c));
        if (m === "RECAP" || m === "MOUVEMENT" || m === "JOUR" || /^S[ÉE]ANCE/.test(m)) break;
        if (!m) { if (++blanks >= 3) break; continue; }
        blanks = 0; last = rr;
        const g = h => (h in cols) ? cell(rr, cols[h]).trim() : "";
        ex.push({row:rr + 1, mouvement:cell(rr, c).trim(), variation:g("VARIATION"), tempo:g("TEMPO"), coach:g("COMMENTAIRE DU COACH"),
          series:g("SÉRIES"), reps:g("RÉPÉTITIONS"), repos:g("REPOS"), charge:g("CHARGE"), e1rm:g("E1RM"), intensite:g("INTENSITÉ CIBLE"),
          rpe1:g("RPE S1"), rpeLast:g("RPE DERNIÈRE SÉRIE"), angle:g("ANGLE A FILMER"), commentaire:g("COMMENTAIRE ATHLÈTE")});
      }
      /* Ligne RECAP : le poids de corps se saisit dans la case fusionnée à droite de « POIDS DE CORPS » */
      let recapRow = 0, pdc = "";
      for (let rr = last + 1; rr < Math.min(v.length, last + 10); rr++) if (norm(cell(rr, c)) === "RECAP") { recapRow = rr + 1; pdc = cell(rr, c + 2).trim(); break; }
      /* Bilan de semaine : libellés sous « Note ta semaine… », valeur dans la colonne suivante */
      const wk = sheet + "|" + semaine;
      if (!weeks[wk]) {
        const b = {bloc, semaine, sheet, col:c + 2, rows:{}, vals:{}};
        for (let rr = r; rr < v.length; rr++){
          if (/^NOTE TA SEMAINE/.test(norm(cell(rr, c)))) {
            for (let z = rr + 1; z < Math.min(v.length, rr + 12); z++){ const lab = BILAN_CRIT.find(k => norm(cell(z, c)) === norm(k)); if (lab) { b.rows[lab] = z + 1; b.vals[lab] = num(cell(z, c + 1)); } }
            break;
          }
        }
        if (Object.keys(b.rows).length) weeks[wk] = b;
      }
      if (!ex.length) continue;
      const k = h => (h in cols) ? cols[h] + 1 : 0;
      seances.push({key:sheet + "|" + semaine + "|" + (r + 1), sheet, bloc, semaine, jour, seance, headerRow:r + 1, idx:nb, recapRow, pdc, pdcCol:c + 3,
        cols:{mouvement:c + 1, rpe1:k("RPE S1"), rpeLast:k("RPE DERNIÈRE SÉRIE"), commentaire:k("COMMENTAIRE ATHLÈTE"), charge:k("CHARGE")},
        exercices:ex, faite:ex.some(e => e.rpe1 || e.rpeLast)});
    }
  }
  return {seances, weeks};
}
const chosenBloc = () => { const n = num(D && D.profil.bloc_actif); return n && blocNames[n] ? n : null; };
const activeBloc = () => { const c = chosenBloc(); if (c !== null && S.some(s => s.bloc === c)) return c; const b = S.map(s => s.bloc); return b.length ? Math.max(...b) : null; };
const nextSeance = () => { const b = activeBloc(); return b === null ? null : (S.find(s => s.bloc === b && !s.faite) || null); };

/* Dates : lundi de la semaine 1 saisi, sinon estimé depuis le début de la prog (blocs consécutifs) */
function weeksIn(b){ const w = S.filter(s => s.bloc === b).map(s => num(s.semaine) || 0); return w.length ? Math.max(...w) : 4; }
function blocStart(b){
  if (D.blocs[b]) return {d:D.blocs[b], est:false};
  const known = Object.keys(D.blocs).map(Number).filter(n => n < b).sort((x, y) => y - x)[0];

  if (known) { base = D.blocs[known]; from = known; } else if (D.profil.debut_coaching) { base = D.profil.debut_coaching; from = 1; } else return null;
  let w = 0; for (let n = from; n < b; n++) w += weeksIn(n);

}
function dateOf(s){ const st = blocStart(s.bloc); if (!st) return null; return addDays(st.d, ((num(s.semaine) || 1) - 1) * 7 + (JOUR_IDX[norm(s.jour)] ?? 0)); }
function liftOf(m){ const x = norm(m); if (x.includes("MUSCLE")) return "MU"; if (x.includes("PULL") || x.includes("TRACTION")) return "PULL"; if (x.includes("DIP")) return "DIP"; if (x.includes("SQUAT")) return "SQUAT"; return null; }

/* =====================================================================
   CALCULS
   ===================================================================== */
const muOn = () => norm(D.profil.mu_acquis) === "OUI";
const cat = () => num(D.profil.categorie) || -80;
const catLimit = () => cat() < 0 ? -cat() : null;
const sexe = () => norm(D.profil.sexe) === "F" ? "F" : "H";
const bw = () => (D.poids.at(-1) || {}).poids || null;
const bwAt = iso => { let v = null; for (const p of D.poids) { if (p.date <= iso) v = p.poids; else break; } return v ?? (D.poids[0] || {}).poids ?? null; };
const risOf = (total, w) => { const c = RIS[sexe()]; if (!total || !w) return null; return total * 100 / (c.a + (c.k - c.a) / (1 + c.q * Math.exp(-c.b * (w - c.v)))); };
function best(l){ if (l === "MU" && !muOn()) return null; const x = D.prs.filter(p => p.lift === l && p.reps === 1); return x.length ? Math.max(...x.map(p => p.charge)) : null; }
const total = () => LIFTS.reduce((s, l) => s + (best(l) || 0), 0);
function bestSeries(l){ let m = -Infinity; const out = []; D.prs.filter(p => p.lift === l && p.reps === 1).forEach(p => { if (p.charge > m) { m = p.charge; out.push({date:p.date, v:m}); } }); return out; }
const record = (type, l) => { const r = D.records.find(r => r.type === type && r.categorie === cat() && r.lift === l); return r && r.valeur ? r : null; };
const nextComp = () => D.comps.find(c => c.date >= D.today) || null;
const firstComp = () => D.comps.length ? D.comps[0].date : null;
/* 1RM estimé (Epley) ; pour MU/tractions/dips, sur la charge réelle (corps + lest) puis ramené au lest */
function e1rm(c, r, lift, w){ if (!r) return null; if (BW_LIFTS.includes(lift) && w) return (w + c) * (1 + r / 30) - w; return c * (1 + r / 30); }
const Gcum = (t, i) => t <= 0 ? 0 : t < 1 ? G1[i] * t : G1[i] + (G10[i] - G1[i]) * Math.log10(t);
function gainFrac(m, i){ const fc = firstComp() || D.today, t0 = Math.max(0, days(fc, D.today) / 365.25); return (1 + Gcum(t0 + m / 12, i)) / (1 + Gcum(t0, i)) - 1; }
function sysLoad(l){ const b = best(l); if (b === null) return null; return BW_LIFTS.includes(l) ? (bw() ? b + bw() : null) : b; }
function band(l, m){ const b = best(l), s = sysLoad(l); if (b === null || !s) return null; return {lo:b + s * gainFrac(m, 0), hi:b + s * gainFrac(m, 1)}; }
function monthsTo(l, target){
  const b = best(l), s = sysLoad(l); if (b === null || !s) return null; if (target <= b) return {early:0, late:0};
  const f = i => { for (let m = 0.25; m <= 120; m += 0.25) if (b + s * gainFrac(m, i) >= target) return m; return Infinity; };
  return {early:f(1), late:f(0)};
}
/* Historique daté d'un mouvement : PR + e1RM des séries « COMP » calculés par la prog */
function liftHistory(l){
  const pts = D.prs.filter(p => p.lift === l && p.reps === 1).map(p => ({date:p.date, v:p.charge, src:"PR"}));
  for (const s of S) { const d = dateOf(s); if (!d || !s.faite) continue;
    for (const e of s.exercices) { if (liftOf(e.mouvement) !== l || norm(e.variation) !== "COMP") continue; const v = num(e.e1rm); if (v) pts.push({date:d, v, src:"prog"}); } }
  return pts.sort((a, b) => a.date < b.date ? -1 : 1);
}
function liftSeries(l){ const h = liftHistory(l), pg = h.filter(x => x.src === "prog"); return pg.length >= 3 ? pg : h.filter(x => x.src === "PR"); }
function measuredTrend(l){
  const p = liftSeries(l); if (p.length < 3 || days(p[0].date, p.at(-1).date) < 28) return null;
  const x = p.map(z => days(p[0].date, z.date)), y = p.map(z => z.v), n = x.length, mx = sum(x) / n, my = sum(y) / n;
  let a = 0, c = 0; x.forEach((xi, i) => { a += (xi - mx) * (y[i] - my); c += (xi - mx) ** 2; });
  return c ? {parMois:a / c * 30.44, n} : null;
}
function monthsByTrend(l, target){ const t = measuredTrend(l), b = best(l); if (!t || b === null || t.parMois <= 0.05) return null; return Math.max(0, (target - b) / t.parMois); }
const objDate = () => D.profil.date_objectif || addDays(D.today, 365);
function zoneHi(l, m){ const r = band(l, m), t = measuredTrend(l), b = best(l); if (!r) return null; return t && t.parMois > 0 ? Math.max(r.hi, b + t.parMois * m) : r.hi; }
function verdictOf(l, obj){
  const b = best(l), m = Math.max(0, days(D.today, objDate()) / 30.44), r = band(l, m); if (!obj || !r || b === null) return null;
  const hi = zoneHi(l, m);
  if (obj <= b) return {k:0, txt:"Déjà atteint", c:"var(--ok)"};
  if (obj <= r.lo) return {k:1, txt:"Prudent", c:"#3d8a62"};
  if (obj <= hi) return {k:2, txt:"Réaliste", c:"var(--ok)"};
  if (obj <= hi + (hi - b)) return {k:3, txt:"Ambitieux", c:"var(--warn)"};
  return {k:4, txt:"Très ambitieux", c:"var(--bad)"};
}
const monthRange = (a, b) => { const x = dmon(a); if (!b || dmon(b) === x) return cap(x) + (b ? "" : " et +"); const y = dmon(b); return x.slice(-2) === y.slice(-2) ? cap(x.split(" ")[0]) + "–" + y : cap(x) + "–" + y; };
const fmtMonths = m => m === Infinity ? "plus de 10 ans" : m < 1 ? "moins d'un mois" : m < 24 ? Math.round(m) + " mois" : fmt(m / 12, 1) + " ans";

/* ---------- Performances par exercice (prog + carnet), regroupées par séance ---------- */
function exercisePoints(){

    if (!sets) continue;

  }
  for (const x of D.series) {

    rows.push({sk: s ? s.key : "d" + x.date, ex:x.ex, lift:liftOf(x.ex.split(" · ")[0]), date:x.date || (s && dateOf(s)), order:x.bloc ? x.bloc * 1000 + (num(x.semaine) || 0) * 10 + (s ? s.idx : 0) : 0, label:x.date ? dfr(x.date) : "B" + x.bloc + " S" + x.semaine, sets:x.sets, src:"carnet"});
  }
  const map = {};
  for (const r of rows) { const o = map[r.ex] = map[r.ex] || {key:r.ex, lift:r.lift, pts:{}}; const p = o.pts[r.sk] = o.pts[r.sk] || {sk:r.sk, date:r.date, order:r.order, label:r.label, rows:[], src:r.src}; p.rows.push(r.sets); if (r.src === "carnet") p.src = "carnet"; }
  return Object.values(map).map(o => {
    const pts = Object.values(o.pts).map(p => {
      const w = bwAt(p.date || D.today), all = p.rows.flat();
      const rowE = p.rows.map(st => sum(st.map(x => e1rm(x.c, x.r, o.lift, w))) / st.length);
      return {...p, sets:all, charge:Math.max(...all.map(x => x.c)), e1rm:Math.max(...rowE), e1rmBest:Math.max(...all.map(x => e1rm(x.c, x.r, o.lift, w))),
        tonnage:sum(all.map(x => x.c * x.r)), totalReps:sum(all.map(x => x.r))};
    }).sort((a, b) => (a.date && b.date) ? (a.date < b.date ? -1 : a.date > b.date ? 1 : a.order - b.order) : a.order - b.order);
    return {key:o.key, lift:o.lift, pts, last:pts.at(-1)};
  }).filter(o => o.pts.length);
}

function getCss(v){ const m = String(v).match(/var\((--[^)]+)\)/); return m ? getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() : v; }
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  return {animation:reduceMotion() ? false : {duration:500}, maintainAspectRatio:true, aspectRatio:1.6, interaction:{mode:"index", intersect:false},
    plugins:{legend:{display:!!o.legend, labels:{color:dust, boxWidth:10, boxHeight:10, usePointStyle:true, font:{family:"Barlow"}}},
      tooltip:{backgroundColor:getCss("var(--chalk)"), titleColor:"#17181B", bodyColor:"#17181B", footerColor:"#17181B", padding:10, cornerRadius:10, displayColors:false,
        
        callbacks:{label:c => c.dataset.label + " : " + fmt(c.parsed.y, 1) + (o.unit || ""), afterBody:o.tooltip ? items => o.tooltip(items[0].dataIndex) : undefined}}},
    scales:{x:{ticks:{color:dust, maxTicksLimit:5, maxRotation:0, font:{family:"Barlow", size:11}}, grid:{display:false}, border:{color:seam}},
            y:{ticks:{color:dust, maxTicksLimit:5, font:{family:"Barlow", size:11}, callback:v => fmt(v, 1)}, grid:{color:seam, drawTicks:false}, border:{display:false}}}};
}
function lineChart(id, labels, sets, o = {}){
  const el = document.getElementById(id); if (!el || typeof Chart === "undefined") return;
  if (charts[id]) charts[id].destroy();

  charts[id] = new Chart(el, {type:"line", data:{labels, datasets:sets.map(s => {
    let bg = s.color; if (s.area) { const g = ctx.createLinearGradient(0, 0, 0, 240); g.addColorStop(0, s.color + "55"); g.addColorStop(1, s.color + "00"); bg = g; } else if (s.fill) bg = s.color + "30";
    const n = s.data.length;
    return {label:s.label, data:s.data, borderColor:s.faint ? s.color + "99" : s.color, backgroundColor:bg, fill:s.area ? "origin" : (s.fill || false), borderDash:s.dash ? [5, 5] : [], borderWidth:s.width || 2,
      pointRadius:s.pts === false || s.dash ? 0 : (ctx2 => ctx2.dataIndex === n - 1 ? 5 : (n > 30 ? 0 : 2.5)), pointBackgroundColor:s.color, pointBorderColor:getCss("var(--deck)"), pointBorderWidth:2, tension:.3};
  })}, options:opts(o)});
}
function barChart(id, labels, sets, unit){

  charts[id] = new Chart(el, {type:"bar", data:{labels, datasets:sets.map(s => ({label:s.label, data:s.data, backgroundColor:s.color, borderColor:getCss("var(--deck)"), borderWidth:{top:2}, borderRadius:4, borderSkipped:"bottom", maxBarThickness:28}))}, options:o});

async function saveWeight(v, dt, toRecap){

    D.poids = D.poids.filter(p => p.date !== dt).concat([{date:dt, poids:v}]).sort((a, b) => a.date < b.date ? -1 : 1);

  } catch(e){ toast(errMsg(e) + ambig(e), true); }
}
async function addPR(l, c, r, d, n){

    D.prs.push({date:d, lift:l, charge:c, reps:r, note:n || ""}); D.prs.sort((a, b) => a.date < b.date ? -1 : 1); saveCache();
    const nb = best(l), isPr = r === 1 && nb !== null && (before === null || nb > before);

  } catch(e){ toast(errMsg(e) + ambig(e), true); }
}

/* Jeton expiré : la séance en cours est déjà gardée sur le téléphone, on se reconnecte et on la rouvre. */
function reauth(){
  if (!navigator.onLine) throw {code:"offline"};
  if (live) { persistLive(); store.set("sl-resume", 1); }
  toast("Reconnexion à Google…"); setTimeout(() => auth.login(), 700);
  return new Promise(() => {});
}
async function gapi(url, opt, isRead){
  const tok = auth.tok; if (!tok) return reauth();
  for (let i = 0; ; i++) {
    let r;
    try { r = await fetch(url, Object.assign({}, opt, {headers:{Authorization:"Bearer " + tok, "Content-Type":"application/json"}})); }
    catch(e){ throw {code:"offline"}; }
    if (r.status === 401) { store.del("sl-tok"); return reauth(); }
    if ((r.status === 429 || r.status >= 500) && isRead && i < 2) { await sleep(1500 * (i + 1) + Math.random() * 500); continue; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw {code: r.status === 403 ? "forbidden" : r.status === 404 ? "not_found" : r.status === 429 ? "quota" : r.status >= 500 ? "server_unavailable" : "tool_error",
      retryable: r.status === 429 || r.status >= 500, message: (j.error && j.error.message) || ("Erreur " + r.status)};
    return j;
  }
}

const dlr = {async save({filename, data}){
  const f = new File([data], filename, {type:data.type || "application/octet-stream"});
  if (!/\.ics$/i.test(filename) && navigator.canShare && navigator.canShare({files:[f]})) {
    try { await navigator.share({files:[f]}); return {status:"saved"}; } catch(e){ if (e && e.name === "AbortError") throw e; }
  }
  const u = URL.createObjectURL(data), a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000); return {status:"saved"};
}};

  if (prs.length) data.push({range:"PR!A2", values:prs});
  if (num(p.poids)) data.push({range:"POIDS!A2", values:[[isoOf(new Date()), num(p.poids), ""]]});
  if (p.bloc && p.blocDate) data.push({range:"BLOCS!A2", values:[[p.bloc, p.blocDate, "saisi à l'inscription"]]});
  await writeMany(id, data);
  return id;
}

/* ---------- Accueil, connexion et choix du carnet ---------- */
let obStep = "login", obErr = "", obPre = null;
/* Lit, dans le dernier onglet BLOC de la prog (modèle du coach), les cases MAX ACTUELS et PROFIL. */
function parseCoachProfile(v){
  const out = {}, cell = (r, c) => String((v[r] && v[r][c]) ?? "").trim();
  const numRight = (r, c) => { for (let k = c + 1; k <= c + 3; k++) { const t = cell(r, k); if (t !== "" && num(t) !== null) return num(t); } return null; };
  const MAP = {MU:"MU", "MUSCLE UP":"MU", PU:"PULL", "PULL UP":"PULL", TRACTIONS:"PULL", DIPS:"DIP", DIP:"DIP", SQUAT:"SQUAT"};
  for (let r = 0; r < v.length; r++) for (let c = 0; c < (v[r] || []).length; c++) {
    const t = norm(cell(r, c));
    if (t === "MAX ACTUELS" && out.max === undefined) { out.max = true;
      for (let rr = r + 1; rr < Math.min(v.length, r + 8); rr++) { const k = MAP[norm(cell(rr, c))]; if (k) { const n = numRight(rr, c); if (n) out["pr_" + k] = n; } } }
    if (t === "POIDS" && out.poids === undefined) out.poids = numRight(r, c) ?? undefined;
    if (t === "TAILLE" && out.taille === undefined) { const n = numRight(r, c); if (n) out.taille = n < 3 ? Math.round(n * 100) : n; }
  }
  delete out.max;
  if (out.poids) { const c = CATS.find(x => x < 0 && out.poids <= -x); out.categorie = c ?? CATS.at(-1); }
  return out;
}
function prenomOf(title){
  const w = String(title || "").trim().split(/\s+/).filter(Boolean); if (!w.length) return "";
  const p = w.filter(x => x !== x.toUpperCase()); const n = (p.length ? p : [w.at(-1)]).join(" ");
  return n.charAt(0).toUpperCase() + n.slice(1).toLowerCase();
}
function onboard(step, why){
  obStep = step; obErr = why || ""; document.body.classList.add("ob");
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "v-home");
  const plates = `<div class="hero" style="margin-top:18px;min-height:150px">${DECO}<svg width="64" height="64" viewBox="0 0 40 40" aria-hidden="true" style="position:relative;background:#fff;border-radius:16px;padding:6px"><circle cx="20" cy="10.5" r="4.2" fill="#1F5FD0"/><path d="M7 17h26" stroke="#1F5FD0" stroke-width="3.6" stroke-linecap="round"/><path d="M11 17l4.5 9 4.5-3.5 4.5 3.5 4.5-9" stroke="#1F5FD0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><p class="hu" style="margin-top:14px">Ta prog, tes records, ta prochaine compét.</p></div>`;
  const err = obErr ? `<p class="small" style="color:var(--bad);margin-top:12px">${esc(obErr)}</p>` : "";
  let h = "";
  if (step === "config") h = `<div class="empty"><p>L'identifiant Google de l'app n'est pas encore configuré.</p></div>`;
  else if (step === "login") h = `${plates}<p class="show" style="font-size:44px;font-weight:800;margin-top:22px;line-height:1">Street Lifting</p>
    <p class="muted" style="margin-top:12px">Connecte ton compte Google. Tes données restent dans ton propre Google Sheet : personne d'autre n'y a accès.</p>
    <button class="btn" style="margin-top:22px" data-act="obLogin">Continuer avec Google</button>${err}
    <p class="muted tiny" style="margin-top:14px">Google peut afficher « application non validée » : c'est normal pour une app en test. Touche « Continuer ».</p>`;
  else if (step === "carnet") h = `<p class="show t-m" style="margin-top:18px">Ton carnet de données</p>
    <p class="muted small" style="margin-top:6px">L'app range tes PR, pesées et séances dans un Google Sheet à toi.</p>
    <div class="panel" style="margin-top:16px"><p style="font-weight:600">Nouveau ici, avec une prog de coach</p><p class="muted small" style="margin-top:4px">Colle le lien de ta prog : l'app y lit ton prénom, ton poids et tes max, et crée ton carnet.</p>
      <label for="obcoach">Lien de la prog de ton coach</label><input id="obcoach" type="url" placeholder="https://docs.google.com/spreadsheets/d/…">
      <button class="btn" style="margin-top:12px" data-act="obFromCoach" id="obfc">Tout remplir depuis ma prog</button>
      <button class="link small" style="margin-top:12px" data-act="obStep" data-s="create">Je n'ai pas de prog, je remplis moi-même</button></div>
    <div class="panel"><p style="font-weight:600">J'ai déjà un carnet</p><label for="oblink">Lien du Google Sheet</label><input id="oblink" type="url" placeholder="https://docs.google.com/spreadsheets/d/…">
      <button class="btn ghost" style="margin-top:12px" data-act="obLink">Utiliser ce carnet</button></div>${err}`;
  else if (step === "create") { const P = obPre || {}, v = x => x === undefined || x === null ? "" : esc(String(x).replace(".", ","));
    h = `<p class="show t-m" style="margin-top:18px">Ton profil</p>
    ${obPre ? `<p class="muted small" style="margin-top:6px">Rempli depuis ta prog${P.bloc ? " (bloc " + P.bloc + ")" : ""}. Vérifie et corrige si besoin.</p>` : ""}
    <label for="obp">Prénom</label><input id="obp" autocomplete="given-name" value="${v(P.prenom)}">
    <div class="grid2"><div><label for="obs">Sexe (pour le RIS)</label><select id="obs"><option value="H">Homme</option><option value="F">Femme</option></select></div>
      <div><label for="obc">Catégorie</label><select id="obc">${CATS.map(c => `<option value="${c}" ${c === (P.categorie || -80) ? "selected" : ""}>${c > 0 ? "+" + c : c} kg</option>`).join("")}</select></div></div>
    <div class="grid2"><div><label for="obd">Début du street lifting</label><input id="obd" type="date"></div><div><label for="obw">Poids de corps (kg)</label><input id="obw" inputmode="decimal" placeholder="73,2" value="${v(P.poids)}"></div></div>
    <label>Tes PR actuels (kg de lest, laisse vide si tu ne sais pas)</label>
    <div class="grid2">${LIFTS.map(l => `<div><label for="obpr${l}" style="margin-top:0">${LNAME[l]}</label><input id="obpr${l}" inputmode="decimal" value="${v(P["pr_" + l])}"></div>`).join("")}</div>
    <label for="obk">Lien de la prog de ton coach (facultatif)</label><input id="obk" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" value="${P.coach ? sheetUrl(P.coach) : ""}">
    ${P.blocs && P.blocs.length ? `<label for="obbl">Ton bloc en cours</label><select id="obbl">${P.blocs.map(n => `<option value="${n}" ${n === P.bloc ? "selected" : ""}>Bloc ${n}</option>`).join("")}</select><p class="muted tiny" style="margin-top:6px">Choisis le bloc que tu fais en ce moment. Tu pourras le changer dans les réglages.</p>` : ""}
    ${P.bloc ? `<label for="obb">Lundi de la semaine 1 de ce bloc</label><input id="obb" type="date"><p class="muted tiny" style="margin-top:6px">Pour dater tes séances. Tu pourras le changer plus tard.</p>` : ""}
    <p class="muted tiny" style="margin-top:6px">La prog doit être partagée avec le compte Google avec lequel tu es connecté.</p>
    <button class="btn" style="margin-top:20px" data-act="obCreate" id="obgo">Créer mon carnet</button>
    <button class="btn ghost" style="margin-top:10px" data-act="obStep" data-s="carnet">Retour</button>${err}`; }
  $("#v-home").innerHTML = `<div class="ob">${h}</div>`;
}
Object.assign(ACT, {
  obLogin:() => auth.login("select_account"),
  obStep:d => onboard(d.s),
  obLink:async () => { const id = idOf($("#oblink").value); if (!id) return onboard("carnet", "Ce lien ne ressemble pas à un lien de Google Sheet.");
    try { const t = await getTitles(id);
      if (t.some(x => /^\s*BLOC\s*\d+/i.test(x)) && !t.includes("PROFIL")) return onboard("carnet", "Ce lien est celui d'une prog de coach, pas d'un carnet. Colle-le plus haut, dans « Nouveau ici, avec une prog de coach ».");
      await ensureTabs(id); } catch(e){ return onboard("carnet", errMsg(e)); }
    setCfg({appId:id}); APP_ID = id; startApp(); },
  obFromCoach:async () => {
    const id = idOf($("#obcoach").value); if (!id) return toast("Ce lien de Google Sheet n'est pas reconnu", true);
    const b = $("#obfc"); b.disabled = true; b.textContent = "Lecture de ta prog…";
    try {
      const meta = await gapi(API + id + "?fields=" + enc("properties.title,sheets.properties.title"), {}, true);
      const tabs = (meta.sheets || []).map(x => x.properties.title), blocs = tabs.map(t => { const m = t.match(/^\s*BLOC\s*(\d+)/i); return m ? {n:+m[1], t} : null; }).filter(Boolean).sort((a, c) => c.n - a.n);
      const pre = {coach:id, prenom:prenomOf(meta.properties && meta.properties.title)};
      if (blocs.length) { Object.assign(pre, parseCoachProfile(await getVals(id, "'" + blocs[0].t.replace(/'/g, "''") + "'!A1:CZ24")), {bloc:blocs[0].n, blocs:blocs.map(x => x.n).sort((a, c) => a - c)}); }
      obPre = pre; onboard("create", blocs.length ? "" : "Aucun onglet « BLOC » trouvé : remplis ton profil à la main.");
    } catch(e){ b.disabled = false; b.textContent = "Tout remplir depuis ma prog"; toast("Prog inaccessible : " + errMsg(e), true); }
  },
  obCreate:async () => {
    const p = {prenom:$("#obp").value.trim(), sexe:$("#obs").value, categorie:Number($("#obc").value), debut:$("#obd").value, poids:$("#obw").value, coach:idOf($("#obk").value),
      taille:obPre && obPre.taille, bloc:$("#obbl") ? Number($("#obbl").value) : obPre && obPre.bloc, blocDate:$("#obb") ? $("#obb").value : ""};
    LIFTS.forEach(l => p["pr_" + l] = $("#obpr" + l).value);
    if (!p.prenom) return toast("Indique ton prénom", true);
    if ($("#obk").value.trim() && !p.coach) return toast("Le lien de la prog n'est pas reconnu", true);
    const b = $("#obgo"); b.disabled = true; b.textContent = "Création…";
    try {
      if (p.coach) { try { await getTitles(p.coach); } catch(e){ b.disabled = false; b.textContent = "Créer mon carnet"; return toast("Prog du coach inaccessible : " + errMsg(e), true); } }
      const id = await createBook(p); setCfg({appId:id}); APP_ID = id; toast("Carnet créé"); startApp();
    } catch(e){ b.disabled = false; b.textContent = "Créer mon carnet"; toast(errMsg(e), true); }
  },
  switchBook:() => { setCfg({appId:""}); APP_ID = ""; D = null; S = []; sheet = null; renderLayer(); onboard("carnet"); },
  logout:() => { auth.logout(); store.set("sl-cfg", {}); APP_ID = ""; D = null; S = []; sheet = null; renderLayer(); onboard("login"); }
});
CHG.coachLink = async (d, el) => {
  const id = idOf(el.value); if (el.value.trim() && !id) return toast("Ce lien de Google Sheet n'est pas reconnu", true);
  if (id) { try { await getTitles(id); } catch(e){ return toast("Prog inaccessible : " + errMsg(e), true); } }
  await CHG.prof({k:"coach_sheet_id"}, {value:id});
  S = []; loadedBlocs.clear(); allLoaded = false; weekMeta = {}; blocNames = {}; syncAll(false);
};
async function fetchEmail(){
  if (cfg().email) return;
  try { const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {headers:{Authorization:"Bearer " + auth.tok}}); const j = await r.json(); if (j.email) setCfg({email:j.email}); } catch(e){}
}

/* =====================================================================
   SYNCHRO ET DÉMARRAGE
   ===================================================================== */
async function syncAll(silent){
  if (syncing || !APP_ID) return; syncing = true; setDot("busy");
  try {
    await loadApp(); render();
    try { await loadCoach(); seanceErr = ""; } catch(e){ seanceErr = "Impossible de lire ta prog : " + errMsg(e); }
    lastSync = Date.now(); setDot("ok"); saveCache(); render();
    if (!silent) toast("Données à jour");
    if (!seanceErr) ensureAllBlocs().then(() => { if (tab !== "seance" && !live) render(); }).catch(() => {});
  } catch(e){ setDot("off"); if (!D) fatal(errMsg(e)); else toast(errMsg(e), true); }
  finally { syncing = false; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && D && Date.now() - lastSync > 60000 && !live) syncAll(true); });
setInterval(() => { if (document.visibilityState === "visible" && D && Date.now() - lastSync > 10 * 60000 && !live) syncAll(true); }, 60000);
function fatal(msg){ $("#v-home").innerHTML = `<div class="empty"><p>${esc(msg)}</p><button class="btn ghost sm" data-act="boot">Réessayer</button><button class="btn ghost sm" data-act="switchBook">Changer de carnet</button></div>`; }
ACT.boot = () => boot();
ACT.relogin = () => { if (live) persistLive(); auth.login(); };
async function startApp(){
  document.body.classList.remove("ob");
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "v-" + tab);
  $("#v-home").innerHTML = `<div class="skel" style="height:190px;margin-top:18px"></div><div class="skel" style="height:150px;margin-top:14px"></div>`;
  const cached = loadCache(); if (cached) render();
  if (!auth.tok) {
    setDot("off");
    if (navigator.onLine && !auth.err) return auth.login();
    if (auth.err) toast("Connexion Google refusée. Réglages, Se reconnecter.", true);
    if (!cached) fatal(auth.err ? "Connexion Google refusée ou annulée." : "Pas de connexion internet. Reviens quand tu as du réseau.");
    return;
  }
  fetchEmail();
  await syncAll(true);
  if (store.get("sl-resume")) { store.del("sl-resume"); const lv = store.get(ck("sl4-live")); if (lv && seanceByKey(lv.key)) startLive(lv.key); }
}
async function boot(){
  auth.fromHash();
  if (!/\.apps\.googleusercontent\.com$/.test(CLIENT_ID)) return onboard("config");
  APP_ID = cfg().appId || "";
  if (APP_ID) return startApp();
  if (!auth.tok) return onboard("login", auth.err ? "Connexion annulée (" + auth.err + "). Réessaie." : "");
  fetchEmail(); onboard("carnet");
}
boot();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
